<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06101c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ibadan Life 3D</title>

<style>
/* =========================================================
   RESET / BASE
========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#06101c;
  color:#eaf2ff;
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  touch-action:none;
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-font-smoothing:antialiased;
}

#game{
  position:fixed;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  outline:none;
}

/* =========================================================
   LOADING
========================================================= */

#loading{
  position:fixed;
  inset:0;
  z-index:80;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 50% 30%,#1d4a72 0%,#0a1a2b 45%,#050d18 100%);
  text-align:center;
  transition:opacity .5s ease;
}

.loader{
  width:min(88vw,400px);
  padding:30px 26px;
  border-radius:26px;
  background:linear-gradient(180deg,rgba(12,24,40,.85),rgba(5,12,22,.9));
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07);
  backdrop-filter:blur(14px);
}

.logo{
  font-size:clamp(24px,7vw,34px);
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{color:#43e17b}

.sub{
  opacity:.62;
  margin:8px 0 22px;
  font-size:13px;
  letter-spacing:.2px;
}

.bar{
  height:6px;
  border-radius:99px;
  background:rgba(255,255,255,.08);
  overflow:hidden;
}

.bar i{
  display:block;
  width:8%;
  height:100%;
  border-radius:99px;
  background:linear-gradient(90deg,#2fbd63,#43e17b,#8df7ae);
  box-shadow:0 0 18px rgba(67,225,123,.6);
  transition:width .35s cubic-bezier(.22,.9,.28,1);
}

.tip{
  margin-top:16px;
  font-size:11px;
  opacity:.45;
  letter-spacing:.3px;
}

/* =========================================================
   HUD
========================================================= */

#hud{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
}

.topbar{
  position:absolute;
  top:calc(8px + env(safe-area-inset-top));
  left:0;
  right:0;
  padding:0 10px;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.hud-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
}

.right-col{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:7px;
}

.panel{
  background:linear-gradient(180deg,rgba(13,24,39,.80),rgba(6,12,22,.74));
  backdrop-filter:blur(16px) saturate(1.25);
  -webkit-backdrop-filter:blur(16px) saturate(1.25);
  border:1px solid rgba(255,255,255,.10);
  border-radius:16px;
  box-shadow:0 10px 28px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07);
}

.profile{
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 11px 8px 8px;
  min-width:0;
}

.avatar{
  width:36px;
  height:36px;
  flex:0 0 36px;
  border-radius:12px;
  display:grid;
  place-items:center;
  font-size:19px;
  background:linear-gradient(145deg,#1d3a58,#0d2033);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
}

.pinfo{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:4px;
}

.pname{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12.5px;
  font-weight:800;
  letter-spacing:.1px;
  line-height:1;
  white-space:nowrap;
}

.lvl{
  font-size:9.5px;
  font-weight:800;
  padding:3px 6px;
  border-radius:99px;
  color:#06210f;
  background:linear-gradient(180deg,#6df0a2,#2fbd63);
  box-shadow:0 2px 8px rgba(67,225,123,.35);
}

.xpwrap{
  width:100%;
  min-width:96px;
  height:4px;
  border-radius:99px;
  background:rgba(255,255,255,.09);
  overflow:hidden;
}

.xpwrap i{
  display:block;
  height:100%;
  width:0%;
  border-radius:99px;
  background:linear-gradient(90deg,#3fa9ff,#7cd4ff);
  transition:width .4s ease;
}

.chips{
  display:flex;
  gap:5px;
}

.chip{
  font-size:10.5px;
  font-weight:800;
  padding:3px 7px;
  border-radius:8px;
  letter-spacing:.2px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.09);
  white-space:nowrap;
}

.chip.cash{color:#8ff0b2}
.chip.bank{color:#ffd98a}

.needs{
  padding:9px 10px;
  display:flex;
  flex-direction:column;
  gap:5px;
  width:112px;
}

.needrow{
  display:grid;
  grid-template-columns:14px 1fr;
  gap:6px;
  align-items:center;
  font-size:9px;
}

.needrow span{
  font-size:10px;
  line-height:1;
  text-align:center;
}

.meter{
  height:5px;
  border-radius:99px;
  background:rgba(255,255,255,.09);
  overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.4);
}

.meter i{
  display:block;
  height:100%;
  width:70%;
  border-radius:99px;
  background:linear-gradient(90deg,#43e17b,#8df7ae);
  transition:width .5s ease,background .5s ease;
}

.meter i.warn{background:linear-gradient(90deg,#f0b429,#ffd977)}
.meter i.bad{background:linear-gradient(90deg,#e5484d,#ff8a8d)}

.phone-btn{
  pointer-events:auto;
  width:44px;
  height:44px;
  border-radius:15px;
  font-size:19px;
  display:grid;
  place-items:center;
  color:#dbe9ff;
  border:1px solid rgba(255,255,255,.12);
  background:linear-gradient(180deg,rgba(30,48,70,.86),rgba(10,20,34,.9));
  backdrop-filter:blur(12px);
  box-shadow:0 8px 22px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .1s ease;
}

.phone-btn:active{transform:scale(.92)}

.loc-row{
  display:flex;
  justify-content:center;
  gap:6px;
  flex-wrap:wrap;
}

.loc,.time{
  background:rgba(4,10,18,.68);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.09);
  padding:5px 12px;
  border-radius:99px;
  font-size:10.5px;
  font-weight:800;
  letter-spacing:.3px;
  white-space:nowrap;
  box-shadow:0 6px 18px rgba(0,0,0,.4);
}

.loc{color:#cfe4ff}
.time{color:#ffd98a}

.hint{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:178px;
  max-width:min(92vw,540px);
  text-align:center;
  background:rgba(4,10,18,.76);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.10);
  border-radius:14px;
  padding:8px 14px;
  font-size:11.5px;
  line-height:1.35;
  letter-spacing:.15px;
  box-shadow:0 10px 28px rgba(0,0,0,.5);
  transition:opacity .3s ease;
}

#vignette{
  position:fixed;
  inset:0;
  z-index:5;
  pointer-events:none;
  background:radial-gradient(ellipse at 50% 48%,transparent 45%,rgba(0,0,0,.36) 100%);
}

/* =========================================================
   CONTROLS
========================================================= */

#controls{
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
}

.joy{
  position:absolute;
  left:calc(16px + env(safe-area-inset-left));
  bottom:calc(20px + env(safe-area-inset-bottom));
  width:126px;
  height:126px;
  border-radius:50%;
  background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.09),rgba(255,255,255,.03) 70%);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 12px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.10);
  pointer-events:auto;
  backdrop-filter:blur(6px);
  touch-action:none;
}

.joy::after{
  content:"";
  position:absolute;
  inset:22px;
  border-radius:50%;
  border:1px dashed rgba(255,255,255,.10);
  pointer-events:none;
}

.knob{
  position:absolute;
  left:50%;
  top:50%;
  width:56px;
  height:56px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle at 40% 32%,rgba(255,255,255,.38),rgba(255,255,255,.14) 60%,rgba(255,255,255,.08));
  border:1px solid rgba(255,255,255,.30);
  box-shadow:0 8px 22px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .06s linear;
  pointer-events:none;
}

.actions{
  position:absolute;
  right:calc(16px + env(safe-area-inset-right));
  bottom:calc(20px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:repeat(2,68px);
  grid-auto-rows:60px;
  gap:9px;
  pointer-events:auto;
}

.btn{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  width:100%;
  height:100%;
  padding:0;
  border:1px solid rgba(255,255,255,.13);
  border-radius:18px;
  background:linear-gradient(180deg,rgba(30,48,70,.86),rgba(10,20,34,.92));
  color:#dbe9ff;
  font-family:inherit;
  font-weight:800;
  font-size:9.5px;
  letter-spacing:.5px;
  backdrop-filter:blur(12px);
  box-shadow:0 8px 22px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .08s ease,background .15s ease,box-shadow .15s ease;
  cursor:pointer;
}

.btn .ico{
  font-size:18px;
  line-height:1;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));
}

.btn:active{
  transform:scale(.93);
  box-shadow:0 3px 10px rgba(0,0,0,.5);
}

.btn.primary{
  background:linear-gradient(180deg,rgba(31,150,84,.92),rgba(12,86,49,.95));
  border-color:rgba(120,255,175,.30);
  color:#eafff3;
  box-shadow:0 8px 26px rgba(24,160,90,.38),inset 0 1px 0 rgba(255,255,255,.16);
}

.btn.gold{
  background:linear-gradient(180deg,rgba(150,110,20,.90),rgba(96,68,8,.95));
  border-color:rgba(255,214,120,.28);
  color:#fff4d6;
}

.btn.run.active{
  background:linear-gradient(180deg,rgba(60,110,200,.92),rgba(24,52,110,.95));
  border-color:rgba(140,190,255,.4);
}

/* =========================================================
   SHEETS / MODALS
========================================================= */

#phone,#modal{
  display:none;
  position:fixed;
  z-index:60;
  inset:0;
  background:rgba(2,6,12,.62);
  backdrop-filter:blur(9px);
  -webkit-backdrop-filter:blur(9px);
  align-items:flex-end;
  justify-content:center;
  padding:10px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  animation:fadeIn .18s ease;
}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}

@keyframes slideUp{
  from{transform:translateY(24px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

.sheet{
  width:min(560px,100%);
  max-height:86vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,#0d1a2b,#081321);
  border:1px solid rgba(255,255,255,.11);
  border-radius:26px;
  padding:20px;
  box-shadow:0 30px 90px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.07);
  animation:slideUp .22s cubic-bezier(.22,.9,.28,1);
}

.sheet h2{
  margin:0 0 5px;
  font-size:19px;
  letter-spacing:-.2px;
}

.sheet p{
  opacity:.62;
  font-size:12.5px;
  margin:0 0 16px;
  line-height:1.45;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.tile{
  border:1px solid rgba(255,255,255,.10);
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));
  border-radius:16px;
  padding:14px 13px;
  color:#eaf2ff;
  text-align:left;
  font-family:inherit;
  font-size:12.5px;
  line-height:1.35;
  cursor:pointer;
  transition:transform .1s ease,background .15s ease,border-color .15s ease;
}

.tile:active{
  transform:scale(.975);
  background:rgba(255,255,255,.12);
  border-color:rgba(255,255,255,.22);
}

.tile strong{
  display:block;
  margin-bottom:3px;
  font-size:13px;
  font-weight:800;
}

.tile small{
  opacity:.6;
  font-size:11px;
  line-height:1.35;
}

.close{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:16px;
  background:rgba(255,255,255,.08);
  color:#eaf2ff;
  font-family:inherit;
  font-weight:800;
  font-size:13px;
  letter-spacing:.3px;
  cursor:pointer;
  transition:background .15s ease,transform .1s ease;
}

.close:active{
  transform:scale(.98);
  background:rgba(255,255,255,.14);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width:380px){
  .avatar{display:none}
  .needs{width:100px;padding:8px}
  .actions{grid-template-columns:repeat(2,62px);grid-auto-rows:56px;gap:8px}
  .joy{width:112px;height:112px}
  .knob{width:50px;height:50px}
  .hint{bottom:160px;font-size:11px}
  .chip{font-size:9.5px;padding:3px 6px}
}

@media (max-width:330px){
  .chips{flex-direction:column;gap:3px}
}

@media (orientation:landscape) and (max-height:560px){
  .needs{display:none}
  .topbar{gap:5px}
  .joy{width:104px;height:104px;bottom:12px}
  .knob{width:46px;height:46px}
  .actions{grid-template-columns:repeat(2,58px);grid-auto-rows:50px;gap:7px;bottom:12px}
  .btn{font-size:8.5px;border-radius:15px}
  .btn .ico{font-size:15px}
  .hint{bottom:12px;max-width:44vw;font-size:10.5px;padding:6px 10px}
  .phone-btn{width:38px;height:38px;font-size:16px}
  .sheet{max-height:92vh;padding:16px}
}

@media (min-width:900px){
  .joy{width:140px;height:140px;left:28px;bottom:28px}
  .knob{width:62px;height:62px}
  .actions{grid-template-columns:repeat(2,76px);grid-auto-rows:66px;right:28px;bottom:28px}
  .hint{bottom:196px;font-size:12.5px}
  .needs{width:126px}
}
</style>
</head>

<body>

<canvas id="game"></canvas>
<div id="vignette"></div>

<div id="loading">
  <div class="loader">
    <div class="logo">IBADAN <span>LIFE</span> 3D</div>
    <div class="sub">Loading your city…</div>
    <div class="bar"><i id="loadbar"></i></div>
    <div class="tip">Move · Work · Eat · Drive · Build your life</div>
  </div>
</div>

<div id="hud">
  <div class="topbar">
    <div class="hud-top">
      <div class="panel profile">
        <div class="avatar">🧑🏾</div>
        <div class="pinfo">
          <div class="pname">David <span class="lvl" id="level">Lv 1</span></div>
          <div class="xpwrap"><i id="xpbar"></i></div>
          <div class="chips">
            <span class="chip cash" id="cash">₦50,000</span>
            <span class="chip bank" id="bank">₦120,000</span>
          </div>
        </div>
      </div>
      <div class="right-col">
        <div class="panel needs">
          <div class="needrow"><span>❤️</span><div class="meter"><i id="health"></i></div></div>
          <div class="needrow"><span>🍗</span><div class="meter"><i id="hunger"></i></div></div>
          <div class="needrow"><span>⚡</span><div class="meter"><i id="energy"></i></div></div>
          <div class="needrow"><span>🧼</span><div class="meter"><i id="hygiene"></i></div></div>
          <div class="needrow"><span>😊</span><div class="meter"><i id="fun"></i></div></div>
        </div>
        <button class="phone-btn" id="phoneBtn" aria-label="Open phone">📱</button>
      </div>
    </div>
    <div class="loc-row">
      <span class="loc" id="location">Family House</span>
      <span class="time" id="time">08:00</span>
    </div>
  </div>
  <div class="hint" id="hint">
    Move around Ibadan. Walk to a door or vehicle.
  </div>
</div>

<div id="controls">
  <div class="joy" id="joy"><div class="knob" id="knob"></div></div>
  <div class="actions">
    <button class="btn run" id="runBtn"><span class="ico">🏃</span>RUN</button>
    <button class="btn primary" id="actionBtn"><span class="ico">✋</span>ACTION</button>
    <button class="btn gold" id="carBtn"><span class="ico">🚗</span>CAR</button>
    <button class="btn" id="camBtn"><span class="ico">🎥</span>CAM</button>
  </div>
</div>

<div id="phone">
  <div class="sheet">
    <h2>📱 David's Phone</h2>
    <p>Your everyday Ibadan Life control centre.</p>
    <div class="grid">
      <button class="tile" data-phone="map"><strong>🗺️ Map</strong><small>Travel around Ibadan</small></button>
      <button class="tile" data-phone="jobs"><strong>💼 Jobs</strong><small>Choose your career</small></button>
      <button class="tile" data-phone="decorate"><strong>🏠 Decorate</strong><small>Buy house furniture</small></button>
      <button class="tile" data-phone="stats"><strong>📊 Stats</strong><small>See your progress</small></button>
      <button class="tile" data-phone="save"><strong>💾 Save</strong><small>Save your life</small></button>
      <button class="tile" data-phone="help"><strong>🎮 Help</strong><small>Controls & activities</small></button>
    </div>
    <button class="close" id="closePhone">Close Phone</button>
  </div>
</div>

<div id="modal">
  <div class="sheet">
    <h2 id="modalTitle">Ibadan Life</h2>
    <p id="modalText"></p>
    <div class="grid" id="modalButtons"></div>
    <button class="close" id="closeModal">Close</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";


/* =========================================================
   HELPERS
========================================================= */

const SAVE_KEY = "IBADAN_LIFE_3D_V3";
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const money = n => "₦" + Math.round(n).toLocaleString("en-NG");

function roundRect(ctx, x, y, w, h, r){
  if(typeof ctx.roundRect === "function"){
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    return;
  }
  const rr = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr, y);
  ctx.lineTo(x+w-rr, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+rr);
  ctx.lineTo(x+w, y+h-rr);
  ctx.quadraticCurveTo(x+w, y+h, x+w-rr, y+h);
  ctx.lineTo(x+rr, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-rr);
  ctx.lineTo(x, y+rr);
  ctx.quadraticCurveTo(x, y, x+rr, y);
  ctx.closePath();
}


/* =========================================================
   GAME STATE
========================================================= */

const DEFAULT_STATE = {
  name:"David",
  cash:50000, bank:120000,
  health:100, hunger:86, energy:90, hygiene:90, social:72, fun:75,
  level:1, xp:0,
  day:1, minutes:480,
  weather:"Sunny", location:"Family House",
  job:"Unemployed", jobPay:0,
  inside:false, building:null,
  driving:false,
  ownedCar:"Toyota Corolla",
  furniture:[],
  lastOutside:{ x:-50, z:-44, rot:0 },
  cameraMode:0
};

let saved = null;
try{ saved = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); }catch(e){ saved = null; }

const state = Object.assign({}, DEFAULT_STATE, saved || {});
state.lastOutside = Object.assign({}, DEFAULT_STATE.lastOutside, saved?.lastOutside || {});
state.furniture = Array.isArray(saved?.furniture) ? saved.furniture : [];


/* =========================================================
   RENDERER / SCENE / CAMERA
========================================================= */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fc0e0);

        vWorldPosition = wp.xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);

    `,

        gl_FragColor = vec4(mix(bottomColor, topColor, t), 1.0);

  })

function canvasTexture(w, h, draw, repeatX = 1, repeatY = 1){
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX, repeatY);
  t.anisotropy = MAX_ANISO;
  return t;
}

/* building facade */
function facadeTexture(faceW, faceH, baseHex, accentHex){
  const PX = 26;
  const W = Math.max(64, Math.min(1024, Math.round(faceW * PX)));
  const H = Math.max(64, Math.min(1024, Math.round(faceH * PX)));
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");
  const base = "#" + baseHex.toString(16).padStart(6, "0");
  const accent = "#" + accentHex.toString(16).padStart(6, "0");
  g.fillStyle = base;
  g.fillRect(0, 0, W, H);
  for(let i = 0; i < W * H / 90; i++){
    const a = Math.random() * 0.06;
    g.fillStyle = Math.random() < 0.5 ? `rgba(0,0,0,${a})` : `rgba(255,255,255,${a})`;
    g.fillRect(Math.random() * W, Math.random() * H, 3, 3);
  }
  const cell = 3.3;
  const cols = Math.max(1, Math.round(faceW / cell));
  const rows = Math.max(1, Math.round(faceH / cell));
  const padX = W * 0.06, padY = H * 0.07;
  const cw = (W - padX * 2) / cols;
  const ch = (H - padY * 2) / rows;
  const ww = cw * 0.56, wh = ch * 0.5;
  for(let r = 0; r < rows; r++){
    for(let c2 = 0; c2 < cols; c2++){
      const x = padX + c2 * cw + (cw - ww) / 2;
      const y = padY + r * ch + (ch - wh) / 2;
      g.fillStyle = "rgba(0,0,0,.28)";
      g.fillRect(x - 3, y - 3, ww + 6, wh + 6);
      g.fillStyle = accent;
      g.fillRect(x - 1.5, y - 1.5, ww + 3, wh + 3);
      const lit = Math.random() < 0.14;
      const grd = g.createLinearGradient(x, y, x + ww, y + wh);
      if(lit){
        grd.addColorStop(0, "#ffeab4"); grd.addColorStop(1, "#d8a94e");
      }else{
        grd.addColorStop(0, "#9dc2da");
        grd.addColorStop(0.5, "#4d7794");
        grd.addColorStop(1, "#27435a");
      }
      g.fillStyle = grd;
      g.fillRect(x, y, ww, wh);
      g.fillStyle = "rgba(255,255,255,.16)";
      g.beginPath();
      g.moveTo(x, y + wh);
      g.lineTo(x + ww * 0.55, y);
      g.lineTo(x + ww, y);
      g.lineTo(x + ww, y + wh * 0.32);
      g.closePath();
      g.fill();
      g.fillStyle = accent;
      g.fillRect(x + ww / 2 - 1, y, 2, wh);
    }
  }
  g.fillStyle = "rgba(0,0,0,.20)";
  g.fillRect(0, H - H * 0.07, W, H * 0.07);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = MAX_ANISO;
  return t;
}

function box(w, h, d, mat, x = 0, y = h / 2, z = 0, parent = world){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function cyl(r, h, mat, x = 0, y = h / 2, z = 0, parent = world, seg = 16){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function plane(w, d, mat, x = 0, y = 0, z = 0, parent = world){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, y, z);
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function textSprite(text, color = "#ffe6a8"){
  const pad = 52, fs = 58;
  const meas = document.createElement("canvas").getContext("2d");
  const font = `800 ${fs}px Inter, system-ui, -apple-system, sans-serif`;
  meas.font = font;
  const tw = meas.measureText(text).width;
  const W = Math.ceil(tw + pad * 2), H = 148;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.font = font;
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillStyle = "rgba(6,14,25,.76)";
  roundRect(g, 6, 20, W - 12, H - 40, 42);
  g.fill();
  g.strokeStyle = "rgba(255,255,255,.20)";
  g.lineWidth = 3;
  g.stroke();
  g.shadowColor = "rgba(0,0,0,.75)";
  g.shadowBlur = 12;
  g.fillStyle = color;
  g.fillText(text, W / 2, H / 2 + 2);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = MAX_ANISO;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthWrite: false
  }));
  const hh = 2.7;
  sprite.scale.set(hh * W / H, hh, 1);
  return sprite;
}

function SPAN_ROAD(){ return 620; }

function buildRoadDecal(){
  const SIZE = 2048, SPAN = 620, s = SIZE / SPAN;
  const c = document.createElement("canvas");
  c.width = c.height = SIZE;
  const g = c.getContext("2d");
  const tx = x => (x + SPAN / 2) * s;
  const tz = z => (z + SPAN / 2) * s;

  g.fillStyle = "#8b8a82";
  for(const r of roads){
    g.fillRect(tx(r.x - r.w/2 - 4), tz(r.z - r.d/2 - 4),
      (r.w + 8) * s, (r.d + 8) * s);
  }
  g.fillStyle = "#33373d";
  for(const r of roads){
    g.fillRect(tx(r.x - r.w/2), tz(r.z - r.d/2), r.w * s, r.d * s);
  }
  g.save();
  g.beginPath();
  for(const r of roads){
    g.rect(tx(r.x - r.w/2), tz(r.z - r.d/2), r.w * s, r.d * s);
  }
  g.clip();
  for(let i = 0; i < 60000; i++){
    const v = 38 + Math.random() * 74 | 0;
    g.fillStyle = `rgba(${v},${v},${v+6},${Math.random() * 0.22})`;
    g.fillRect(Math.random() * SIZE, Math.random() * SIZE, 2.5, 2.5);
  }
  g.restore();
  g.fillStyle = "#e6d27a";
  for(const r of roads){
    if(r.w > r.d){
      const y = tz(r.z) - 2.4;
      for(let x = tx(r.x - r.w/2); x < tx(r.x + r.w/2); x += 13 * s){
        g.fillRect(x, y, 7 * s, 4.8);
      }
    }else{
      const x = tx(r.x) - 2.4;
      for(let z = tz(r.z - r.d/2); z < tz(r.z + r.d/2); z += 13 * s){
        g.fillRect(x, z, 4.8, 7 * s);
      }
    }
  }
  g.strokeStyle = "rgba(255,255,255,.10)";
  g.lineWidth = 2;
  for(const r of roads){
    g.strokeRect(tx(r.x - r.w/2) + 1, tz(r.z - r.d/2) + 1, r.w * s - 2, r.d * s - 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = MAX_ANISO;
  return t;
}

function makeBuilding(b){
  const g = new THREE.Group();
  g.position.set(b.x, 0, b.z);
  g.userData.building = b;

  const sideTex  = facadeTexture(b.d, b.h, b.color, b.accent);
  const frontTex = facadeTexture(b.w, b.h, b.color, b.accent);
  const sideMat = new THREE.MeshStandardMaterial({ map: sideTex, roughness: .88, metalness: .03 });
  const frontMat = new THREE.MeshStandardMaterial({ map: frontTex, roughness: .88, metalness: .03 });
  const roofMat = new THREE.MeshStandardMaterial({ color: 0x5d332a, roughness: .9 });

  const matsArr = [sideMat, sideMat, roofMat, roofMat, frontMat, frontMat];

  const body = new THREE.Mesh(new THREE.BoxGeometry(b.w, b.h, b.d), matsArr);
  body.position.y = b.h / 2;
  body.castShadow = true;
  body.receiveShadow = true;
  g.add(body);

  const slab = box(b.w + 1.4, 0.9, b.d + 1.4, mats.roof, 0, b.h + 0.45, 0, g);
  slab.castShadow = true;
  box(b.w + 1.8, 0.35, b.d + 1.8, mats.dark, 0, b.h + 0.95, 0, g);

  const doorLocalX = b.door[0] - b.x;
  const doorLocalZ = b.door[1] - b.z;

  const canopy = box(6, 0.35, 3.4, mats.dark,
    doorLocalX, 3.3, doorLocalZ + (doorLocalZ > 0 ? -1.4 : 1.4), g);
  canopy.castShadow = true;

  box(2.8, 2.4, 0.22, mats.darkWood, doorLocalX, 1.2, doorLocalZ, g);

  const strip = box(3.2, 0.14, 0.3,
    new THREE.MeshStandardMaterial({
      color: 0x2ecc71, emissive: 0x1e8a4a, emissiveIntensity: .9
    }),
    doorLocalX, 2.55, doorLocalZ, g);
  strip.castShadow = false;

  const label = textSprite(b.name);
  label.position.set(0, b.h + 4.4, 0);
  g.add(label);

  world.add(g);
  b.group = g;
}

/* =========================================================
   MATERIAL CACHE — shared across all humans
========================================================= */

const _matCache = new Map();

function mat(color, rough = 0.85, metal = 0){
  const key = "m|" + color + "|" + rough + "|" + metal;
  let m = _matCache.get(key);
  if(!m){
    m = new THREE.MeshStandardMaterial({
      color, roughness: rough, metalness: metal
    });
    _matCache.set(key, m);
  }
  return m;
}


/* =========================================================
   HUMAN FACTORY
========================================================= */

function makeHuman(opts = {}){

  const skinC  = opts.skin  ?? 0x8b5636;
  const shirtC = opts.shirt ?? 0x2f6fb5;
  const pantsC = opts.pants ?? 0x24303f;
  const shoeC  = opts.shoes ?? 0x15181d;
  const hairC  = opts.hair  ?? 0x191310;

  const hairStyle  = opts.hairStyle  ?? "short";
  const shirtStyle = opts.shirtStyle ?? "tshirt";
  const hasShorts  = !!opts.shorts;
  const hasCap     = !!opts.cap;
  const hasGlasses = !!opts.glasses;
  const hasWatch   = !!opts.watch;
  const hasBackpack= !!opts.backpack;
  const hasChain   = !!opts.chain;

  const skinMat  = mat(skinC, 0.82, 0);
  const shirtMat = mat(shirtC, 0.88, 0);
  const pantsMat = mat(pantsC, 0.92, 0);
  const shoeMat  = mat(shoeC, 0.62, 0.05);
  const soleMat  = mat(0xf0f0ec, 0.9, 0);
  const hairMat  = mat(hairC, 0.96, 0);
  const darkMat  = mat(0x0a0a0a, 0.6, 0.1);
  const eyeWMat  = mat(0xf8f8f5, 0.3, 0);
  const pupilMat = mat(0x0a0a0a, 0.35, 0);
  const beltMat  = mat(0x1a1a1a, 0.7, 0.05);

  const g = new THREE.Group();

  /* ---------------- LEGS ---------------- */
  const legs = {};

  [-1, 1].forEach(side => {

    const pivot = new THREE.Group();
    pivot.position.set(side * 0.09, 0.90, 0);
    g.add(pivot);

    /* thigh (pants or skin if shorts) */
    const thigh = new THREE.Mesh(HG.thigh, pantsMat);
    thigh.position.y = -0.18;
    thigh.castShadow = true;
    pivot.add(thigh);

    /* calf */
    const calfMat = hasShorts ? skinMat : pantsMat;
    const calf = new THREE.Mesh(HG.calf, calfMat);
    calf.position.y = -0.52;
    calf.castShadow = true;
    pivot.add(calf);

    /* short white sock on bare legs */
    if(hasShorts){
      const sock = new THREE.Mesh(HG.calf, soleMat);
      sock.scale.set(1.02, 0.28, 1.02);
      sock.position.y = -0.74;
      pivot.add(sock);
    }

    /* shoe */
    const shoe = new THREE.Mesh(HG.shoe, shoeMat);
    shoe.position.set(0, -0.858, 0.035);
    shoe.castShadow = true;
    pivot.add(shoe);

    /* sole */
    const sole = new THREE.Mesh(HG.sole, soleMat);
    sole.position.set(0, -0.891, 0.035);
    sole.castShadow = true;
    pivot.add(sole);

    legs[side < 0 ? "left" : "right"] = pivot;

  });

  /* ---------------- PELVIS ---------------- */
  const hip = new THREE.Mesh(HG.hip, pantsMat);
  hip.position.y = 0.96;
  hip.castShadow = true;
  g.add(hip);

  const belt = new THREE.Mesh(HG.belt, beltMat);
  belt.position.y = 0.902;
  g.add(belt);

  /* ---------------- TORSO ---------------- */
  const belly = new THREE.Mesh(HG.belly, shirtMat);
  belly.position.y = 1.10;
  belly.castShadow = true;
  g.add(belly);

  const chest = new THREE.Mesh(HG.chest, shirtMat);
  chest.position.y = 1.33;
  chest.castShadow = true;
  g.add(chest);

  /* shirt style details */
  if(shirtStyle === "polo" || shirtStyle === "button"){

    const collar = new THREE.Mesh(HG.collar, shirtMat);
    collar.position.set(0, 1.48, 0.01);
    collar.rotation.x = Math.PI / 2;
    collar.scale.set(1, 0.55, 1);
    g.add(collar);

    const strip = new THREE.Mesh(HG.btnStrip, darkMat);
    strip.position.set(0, 1.28, 0.092);
    g.add(strip);

    if(shirtStyle === "button"){
      for(let i = 0; i < 3; i++){
        const btn = new THREE.Mesh(HG.button, darkMat);
        btn.position.set(0, 1.38 - i * 0.09, 0.096);
        g.add(btn);
      }
    }

  }

  /* gold chain / pendant */
  if(hasChain){
    const chain = new THREE.Mesh(
      HG.chain,
      new THREE.MeshStandardMaterial({
        color: 0xffd24a, metalness: 0.95, roughness: 0.18
      })
    );
    chain.position.set(0, 1.47, 0.075);
    chain.rotation.x = Math.PI / 2;
    chain.scale.set(1, 0.65, 1);
    g.add(chain);
  }

  /* ---------------- NECK ---------------- */
  const neck = new THREE.Mesh(HG.neck, skinMat);
  neck.position.y = 1.53;
  neck.castShadow = true;
  g.add(neck);

  /* ---------------- HEAD ---------------- */
  const headGroup = new THREE.Group();
  headGroup.position.y = 1.72;
  g.add(headGroup);

  const head = new THREE.Mesh(HG.head, skinMat);
  head.scale.set(0.98, 1.06, 1.0);
  head.castShadow = true;
  headGroup.add(head);

  /* ears */
  const earL = new THREE.Mesh(HG.ear, skinMat);
  earL.position.set(-0.183, -0.01, 0);
  headGroup.add(earL);

  const earR = new THREE.Mesh(HG.ear, skinMat);
  earR.position.set(0.183, -0.01, 0);
  headGroup.add(earR);

  /* eyes */
  const eyeL = new THREE.Mesh(HG.eyeWhite, eyeWMat);
  eyeL.position.set(-0.062, 0.025, 0.152);
  headGroup.add(eyeL);

  const eyeR = new THREE.Mesh(HG.eyeWhite, eyeWMat);
  eyeR.position.set(0.062, 0.025, 0.152);
  headGroup.add(eyeR);

  const pupilL = new THREE.Mesh(HG.pupil, pupilMat);
  pupilL.position.set(-0.062, 0.025, 0.168);
  headGroup.add(pupilL);

  const pupilR = new THREE.Mesh(HG.pupil, pupilMat);
  pupilR.position.set(0.062, 0.025, 0.168);
  headGroup.add(pupilR);

  /* brows */
  const browL = new THREE.Mesh(HG.brow, hairMat);
  browL.position.set(-0.062, 0.077, 0.155);
  headGroup.add(browL);

  const browR = new THREE.Mesh(HG.brow, hairMat);
  browR.position.set(0.062, 0.077, 0.155);
  headGroup.add(browR);

  /* nose */
  const nose = new THREE.Mesh(HG.nose, skinMat);
  nose.position.set(0, -0.018, 0.168);
  nose.scale.set(0.85, 1.05, 1.15);
  headGroup.add(nose);

  /* mouth */
  const mouth = new THREE.Mesh(HG.mouth, darkMat);
  mouth.position.set(0, -0.075, 0.163);
  headGroup.add(mouth);

  /* hair (not when wearing a cap) */
  if(hairStyle !== "bald" && !hasCap){

    const hair = new THREE.Mesh(HG.hairBase, hairMat);
    hair.position.y = 0.006;
    hair.castShadow = true;

    if(hairStyle === "afro"){
      hair.scale.set(1.14, 1.32, 1.14);
      hair.position.y = 0.02;
    }else if(hairStyle === "fade"){
      hair.scale.set(0.98, 0.94, 0.98);
    }

    headGroup.add(hair);

  }

  /* cap */
  if(hasCap){

    const capMat = mat(opts.capColor ?? 0xd04545, 0.82, 0);

    const cap = new THREE.Mesh(HG.capDome, capMat);
    cap.position.y = 0.03;
    cap.scale.set(1.02, 0.88, 1.02);
    cap.castShadow = true;
    headGroup.add(cap);

    const brim = new THREE.Mesh(HG.capBrim, capMat);
    brim.position.set(0, 0.038, 0.19);
    brim.castShadow = true;
    headGroup.add(brim);

    const btn = new THREE.Mesh(HG.capBtn, capMat);
    btn.position.y = 0.205;
    headGroup.add(btn);

  }

  /* glasses */
  if(hasGlasses){

    const frameMat = mat(0x111111, 0.35, 0.55);
    const lensMat = new THREE.MeshStandardMaterial({
      color: 0x223344, transparent: true, opacity: 0.55,
      metalness: 0.5, roughness: 0.1
    });

    const fL = new THREE.Mesh(HG.glassRing, frameMat);
    fL.position.set(-0.062, 0.025, 0.172);
    headGroup.add(fL);

    const fR = new THREE.Mesh(HG.glassRing, frameMat);
    fR.position.set(0.062, 0.025, 0.172);
    headGroup.add(fR);

    const lL = new THREE.Mesh(HG.glassLens, lensMat);
    lL.position.set(-0.062, 0.025, 0.174);
    headGroup.add(lL);

    const lR = new THREE.Mesh(HG.glassLens, lensMat);
    lR.position.set(0.062, 0.025, 0.174);
    headGroup.add(lR);

    const bridge = new THREE.Mesh(HG.glassBridge, frameMat);
    bridge.position.set(0, 0.032, 0.172);
    headGroup.add(bridge);

    const tL = new THREE.Mesh(HG.glassTemple, frameMat);
    tL.position.set(-0.155, 0.032, 0.08);
    headGroup.add(tL);

    const tR = new THREE.Mesh(HG.glassTemple, frameMat);
    tR.position.set(0.155, 0.032, 0.08);
    headGroup.add(tR);

  }

  /* ---------------- ARMS ---------------- */
  const arms = {};

  [-1, 1].forEach(side => {

    const pivot = new THREE.Group();
    pivot.position.set(side * 0.21, 1.42, 0);
    g.add(pivot);

    /* shoulder cap */
    const shoulder = new THREE.Mesh(HG.shoulder, shirtMat);
    shoulder.castShadow = true;
    pivot.add(shoulder);

    /* upper arm (sleeve) */
    const upperArm = new THREE.Mesh(HG.upperArm, shirtMat);
    upperArm.position.y = -0.13;
    upperArm.castShadow = true;
    pivot.add(upperArm);

    /* forearm (skin for short sleeves, sleeve for long) */
    const foreMat = shirtStyle === "longsleeve" ? shirtMat : skinMat;
    const foreArm = new THREE.Mesh(HG.foreArm, foreMat);
    foreArm.position.y = -0.37;
    foreArm.castShadow = true;
    pivot.add(foreArm);

    /* hand */
    const hand = new THREE.Mesh(HG.hand, skinMat);
    hand.position.y = -0.53;
    hand.castShadow = true;
    pivot.add(hand);

    /* watch on right wrist */
    if(hasWatch && side === 1){
      const watch = new THREE.Mesh(
        HG.watch,
        new THREE.MeshStandardMaterial({
          color: 0xd0d0d0, metalness: 0.9, roughness: 0.2
        })
      );
      watch.position.set(0, -0.45, 0);
      pivot.add(watch);
    }

    /* natural arm pose */
    pivot.rotation.z = side * 0.09;

    arms[side < 0 ? "left" : "right"] = pivot;

  });

  /* ---------------- BACKPACK ---------------- */
  if(hasBackpack){

    const bpMat = mat(opts.backpackColor ?? 0x333a44, 0.88, 0);

    const pack = new THREE.Mesh(HG.backpack, bpMat);
    pack.position.set(0, 1.22, -0.17);
    pack.castShadow = true;
    g.add(pack);

    const sL = new THREE.Mesh(HG.bpStrap, bpMat);
    sL.position.set(-0.10, 1.32, -0.088);
    g.add(sL);

    const sR = new THREE.Mesh(HG.bpStrap, bpMat);
    sR.position.set(0.10, 1.32, -0.088);
    g.add(sR);

    const buckle = new THREE.Mesh(HG.bpBuckle, darkMat);
    buckle.position.set(0, 1.18, -0.115);
    g.add(buckle);

  }

  g.userData.limbs = { arms, legs };

  return g;

}

========================================================= */

const loader = new GLTFLoader();

async function loadPlayer(){
  try{
    const gltf = await Promise.race([
      loader.loadAsync("https://threejs.org/examples/models/gltf/Soldier.glb"),
      new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 8000))
    ]);

    player.remove(playerVisual);

    playerVisual = SkeletonUtils.clone(gltf.scene);
    playerVisual.scale.setScalar(1.15);

    playerVisual.traverse(o => {
      if(o.isMesh){
        o.castShadow = true;
        o.receiveShadow = true;
        o.frustumCulled = false;
      }
    });

    player.add(playerVisual);

    /* disable procedural animation, use mixer instead */
    playerLimbs = null;
    playerReal = true;

    playerMixer = new THREE.AnimationMixer(playerVisual);

    gltf.animations.forEach(clip => {
      playerActions[clip.name] = playerMixer.clipAction(clip);
    });

    playAnim("Idle");

  }catch(e){
    console.warn("Using fallback character model.");
  }
}

function playAnim(name){
  if(!playerMixer) return;
  const keys = Object.keys(playerActions);
  const key =
    keys.find(k => k.toLowerCase() === name.toLowerCase()) ||
    keys.find(k => k.toLowerCase().includes(name.toLowerCase()));
  if(!key) return;
  if(playerMixer._current === key) return;
  playerMixer._current = key;
  Object.values(playerActions).forEach(a => a.fadeOut(0.18));
  playerActions[key].reset().fadeIn(0.18).play();
}

const tireGeo = new THREE.CylinderGeometry(0.62, 0.62, 0.36, 18);
const rimGeo  = new THREE.CylinderGeometry(0.34, 0.34, 0.38, 12);

const tireMat = new THREE.MeshStandardMaterial({ color: 0x0e1013, roughness: .95 });
const rimMat  = new THREE.MeshStandardMaterial({ color: 0xb6bcc3, metalness: .9, roughness: .28 });
const glassMat = new THREE.MeshStandardMaterial({
  color: 0x16222c, metalness: .55, roughness: .12,
  transparent: true, opacity: .88
});
const headMat = new THREE.MeshStandardMaterial({
  color: 0xfff4d2, emissive: 0xffe6a8, emissiveIntensity: .9, roughness: .25
});
const tailMat = new THREE.MeshStandardMaterial({
  color: 0x8a1414, emissive: 0xa01010, emissiveIntensity: .7, roughness: .35
});

function fallbackCar(name, color, w = 4, l = 8){
  const g = new THREE.Group();

  const bodyMat = new THREE.MeshStandardMaterial({
    color, metalness: .55, roughness: .34
  });

  box(w, 0.62, l, bodyMat, 0, 0.72, 0, g);
  box(w * 0.94, 0.22, l * 0.96, mats.dark, 0, 0.45, 0, g);
  box(w * 0.86, 0.62, l * 0.46, glassMat, 0, 1.32, -l * 0.03, g);
  box(w * 0.78, 0.14, l * 0.42, bodyMat, 0, 1.66, -l * 0.03, g);
  box(w * 0.92, 0.16, l * 0.28, bodyMat, 0, 1.06, l * 0.31, g);
  box(w * 0.92, 0.16, l * 0.22, bodyMat, 0, 1.06, -l * 0.35, g);

  for(const x of [-w/2 - 0.02, w/2 + 0.02]){
    for(const z of [-l * 0.31, l * 0.31]){
      const tire = new THREE.Mesh(tireGeo, tireMat);
      tire.rotation.z = Math.PI / 2;
      tire.position.set(x, 0.62, z);
      tire.castShadow = true;
      g.add(tire);

      const rim = new THREE.Mesh(rimGeo, rimMat);
      rim.rotation.z = Math.PI / 2;
      rim.position.set(x + (x > 0 ? 0.02 : -0.02), 0.62, z);
      g.add(rim);
    }
  }

  for(const x of [-w * 0.32, w * 0.32]){
    box(0.55, 0.2, 0.1, headMat, x, 0.88, l/2 + 0.03, g);
  }
  for(const x of [-w * 0.32, w * 0.32]){
    box(0.5, 0.18, 0.1, tailMat, x, 0.88, -l/2 - 0.03, g);
  }

  g.userData.carName = name;
  g.userData.length = l;
  return g;
}

function addTraffic(){
  carSpecs.forEach((s, i) => {
    const car = fallbackCar(...s);
    car.position.set(-170 + i * 55, 0, 13);
    car.rotation.y = Math.PI / 2;
    car.userData.speed = 0.05 + i * 0.008;
    car.userData.traffic = true;
    world.add(car);
    vehicles.push(car);
  });
}

/* =========================================================
   PROXIMITY
========================================================= */

function nearestBuilding(){
  let best = null, bestDistance = Infinity;
  for(const b of buildings){
    const d = Math.hypot(player.position.x - b.door[0], player.position.z - b.door[1]);
    if(d < bestDistance){ bestDistance = d; best = b; }
  }
  return bestDistance < 5.0 ? best : null;
}

function nearestVehicle(){
  let best = null, bestDistance = Infinity;
  for(const v of vehicles){
    if(v.userData.driver) continue;
    const d = v.position.distanceTo(player.position);
    if(d < bestDistance){ bestDistance = d; best = v; }
  }
  return bestDistance < 5.5 ? best : null;
}

/* =========================================================
   INPUT: JOYSTICK
========================================================= */

const joy = { active:false, x:0, y:0 };
const joyEl = $("joy");
const knob = $("knob");
let joyPointer = null;

function updateJoy(clientX, clientY){
  const r = joyEl.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  let dx = clientX - cx;
  let dy = clientY - cy;
  const max = r.width * 0.33;
  const len = Math.hypot(dx, dy);
  if(len > max){ dx = dx / len * max; dy = dy / len * max; }
  joy.x = dx / max;
  joy.y = -dy / max;
  knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}

function joyEnd(){
  joy.active = false;
  joy.x = 0;
  joy.y = 0;
  joyPointer = null;
  knob.style.transform = "translate(-50%,-50%)";
}

joyEl.addEventListener("pointerdown", e => {
  joy.active = true;
  joyPointer = e.pointerId;
  joyEl.setPointerCapture(e.pointerId);
  updateJoy(e.clientX, e.clientY);
});

joyEl.addEventListener("pointermove", e => {
  if(joy.active && e.pointerId === joyPointer){
    updateJoy(e.clientX, e.clientY);
  }
});

joyEl.addEventListener("pointerup", joyEnd);
joyEl.addEventListener("pointercancel", joyEnd);

   INPUT: KEYBOARD
========================================================= */

const keys = {};

window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if(k === "e") performAction();
  if(k === "f"){
    if(state.driving){
      exitVehicle();
    }else{
      const car = nearestVehicle();
      const building = nearestBuilding();
      if(car) enterVehicle(car);
      else if(building) enterBuilding(building);
      else showHintToast("Nothing nearby to enter.");
    }
  }
  if(k === "q" && state.driving) exitVehicle();
  if(k === "escape"){ closePhone(); closeModal(); }
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)){
    e.preventDefault();
  }
});

window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

function keyboardInput(){
  if(joy.active) return;
  let x = 0, y = 0;
  if(keys.a || keys.arrowleft)  x -= 1;
  if(keys.d || keys.arrowright) x += 1;
  if(keys.w || keys.arrowup)    y += 1;
  if(keys.s || keys.arrowdown)  y -= 1;
  const len = Math.hypot(x, y);
  joy.x = len ? x / len : 0;
  joy.y = len ? y / len : 0;
  if(len > 0){
    running = !!(keys.shift || keys.shiftleft || keys.shiftright);
  }else{
    running = false;
  }
}


/* =========================================================
   COLLISION
========================================================= */

function canMoveOutside(pos){
  const margin = 0.85;
  if(pos.x < -268 + margin || pos.x > 268 - margin ||
     pos.z < -268 + margin || pos.z > 268 - margin){
    return false;
  }
  for(const b of buildings){
    const dx = Math.abs(pos.x - b.x);
    const dz = Math.abs(pos.z - b.z);
    if(dx < b.w / 2 + margin && dz < b.d / 2 + margin){
      const doorDistance = Math.hypot(
        pos.x - b.door[0], pos.z - b.door[1]
      );
      if(doorDistance > 3.6) return false;
    }
  }
  return true;
}

function constrainInterior(p){
  p.x = clamp(p.x, -14.0, 14.0);
  p.z = clamp(p.z, -10.6, 10.6);
}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

let walkCycle = 0;

function updatePlayer(dt){

  if(state.driving) return;

  keyboardInput();

  const ix = joy.x;
  const iy = joy.y;
  const inputMag = Math.hypot(ix, iy);

  if(inputMag < 0.05){

    if(playerMixer){
      playAnim("Idle");
    }else if(playerLimbs){
      const L = playerLimbs;
      L.legs.left.rotation.x  *= 0.85;
      L.legs.right.rotation.x *= 0.85;
      L.arms.left.rotation.x  *= 0.85;
      L.arms.right.rotation.x *= 0.85;
      playerVisual.position.y *= 0.85;
    }

    return;

  }

  const speed = (running ? 7.2 : 4.0) * dt;

  const forward = new THREE.Vector3(Math.sin(cameraYaw), 0, Math.cos(cameraYaw));
  const right = new THREE.Vector3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw));

  const delta = forward.clone().multiplyScalar(iy * speed)
    .add(right.multiplyScalar(ix * speed));

  const next = player.position.clone().add(delta);

  if(state.inside){
    constrainInterior(next);
  }else{
    if(!canMoveOutside(next)) return;
  }

  player.position.copy(next);

  const targetRot = Math.atan2(delta.x, delta.z);
  let diff = targetRot - player.rotation.y;
  while(diff >  Math.PI) diff -= Math.PI * 2;
  while(diff < -Math.PI) diff += Math.PI * 2;
  player.rotation.y += diff * Math.min(1, dt * 14);

  if(playerMixer){
    playAnim(running ? "Run" : "Walk");
  }else if(playerLimbs){
    const L = playerLimbs;
    walkCycle += dt * (running ? 13 : 8);
    const swing = running ? 0.9 : 0.55;
    L.legs.left.rotation.x  =  Math.sin(walkCycle) * swing;
    L.legs.right.rotation.x = -Math.sin(walkCycle) * swing;
    L.arms.left.rotation.x  = -Math.sin(walkCycle) * swing * 0.75;
    L.arms.right.rotation.x =  Math.sin(walkCycle) * swing * 0.75;
    playerVisual.position.y =
      Math.abs(Math.sin(walkCycle * 2)) * (running ? 0.055 : 0.03);
  }

  state.hunger  = clamp(state.hunger  - dt * (running ? 0.05 : 0.03));
  state.energy  = clamp(state.energy  - dt * (running ? 0.06 : 0.025));
  state.hygiene = clamp(state.hygiene - dt * 0.018);
  state.fun     = clamp(state.fun     + dt * 0.002);

}


/* =========================================================
   VEHICLES
========================================================= */

function enterVehicle(v){
  if(!v || state.driving) return;
  state.driving = true;
  playerCar = v;
  v.userData.driver = true;
  player.visible = false;
  setHint("Driving. Use the joystick to drive.");
  saveGame();
}

function exitVehicle(){
  if(!state.driving) return;
  state.driving = false;
  if(playerCar){
    playerCar.userData.driver = false;
    const side = new THREE.Vector3(
      Math.cos(playerCar.rotation.y), 0,
      -Math.sin(playerCar.rotation.y)
    );
    player.position.copy(playerCar.position);
    player.position.add(side.multiplyScalar(3.2));
    player.position.y = 0;
    if(!canMoveOutside(player.position)){
      player.position.copy(playerCar.position);
      player.position.y = 0;
    }
  }
  playerCar = null;
  player.visible = true;
  setHint("You left the vehicle.");
  saveGame();
}

function updateDriving(dt){
  if(!playerCar) return;
  keyboardInput();
  const throttle = joy.y;
  const steer = joy.x;
  playerCar.rotation.y += steer * dt * 1.9 * (Math.abs(throttle) + 0.28);
  const speed = throttle * (running ? 18 : 11) * dt;
  const forward = new THREE.Vector3(
    Math.sin(playerCar.rotation.y), 0,
    Math.cos(playerCar.rotation.y)
  );
  const next = playerCar.position.clone().add(forward.multiplyScalar(speed));
  if(next.x > -270 && next.x < 270 && next.z > -270 && next.z < 270){
    playerCar.position.copy(next);
  }
  state.location = getDistrict(playerCar.position.x, playerCar.position.z);
}


/* =========================================================
   NPCS
========================================================= */

function updateNPCs(dt){
  if(state.inside) return;
  for(const npc of npcs){
    const target = npc.userData.target;
    const distance = npc.position.distanceTo(target);
    if(distance < 3){
      target.set(
        Math.random() * 400 - 200,
        0,
        Math.random() * 400 - 200
      );
      continue;
    }
    const direction = target.clone().sub(npc.position).normalize();
    npc.position.addScaledVector(direction, npc.userData.speed * dt * 60);
    npc.rotation.y = Math.atan2(direction.x, direction.z);

    /* bob the NPC a little while walking */
    const limbs = npc.userData.limbs;
    if(limbs){
      const phase = npc.userData.phase + performance.now() * 0.006;
      const swing = 0.45;
      limbs.legs.left.rotation.x  =  Math.sin(phase) * swing;
      limbs.legs.right.rotation.x = -Math.sin(phase) * swing;
      limbs.arms.left.rotation.x  = -Math.sin(phase) * swing * 0.75;
      limbs.arms.right.rotation.x =  Math.sin(phase) * swing * 0.75;
    }
  }
}


/* =========================================================
   TRAFFIC
========================================================= */

function updateTraffic(dt){
  for(const v of vehicles){
    if(v.userData.driver) continue;
    if(v.userData.traffic){
      v.position.x += v.userData.speed * dt * 60;
      if(v.position.x > 285) v.position.x = -285;
    }
  }
}


/* =========================================================
   CAMERA
========================================================= */

const camTarget = new THREE.Vector3();
const camDesired = new THREE.Vector3();

function updateCamera(dt){
  const lerpFactor = 1 - Math.pow(0.0016, dt);

  if(state.inside){
    camTarget.copy(player.position).add(new THREE.Vector3(0, 1.3, 0));
    camDesired.copy(camTarget).add(new THREE.Vector3(0, 8.5, 11));
    camera.position.lerp(camDesired, lerpFactor * 0.75);
    camera.lookAt(camTarget);
    return;
  }

  if(state.driving && playerCar){
    const forward = new THREE.Vector3(
      Math.sin(playerCar.rotation.y), 0,
      Math.cos(playerCar.rotation.y)
    );
    camTarget.copy(playerCar.position).add(new THREE.Vector3(0, 1.3, 0));
    camDesired.copy(camTarget).addScaledVector(forward, -12.5);
    camDesired.y += 6.5;
    camera.position.lerp(camDesired, lerpFactor * 0.85);
    camera.lookAt(camTarget);
    return;
  }

  camTarget.copy(player.position).add(new THREE.Vector3(0, 1.35, 0));
  const distance = cameraMode === 1 ? 7.5 : 11;
  camDesired.set(
    camTarget.x - Math.sin(cameraYaw) * distance,
    camTarget.y + (cameraMode === 1 ? 4.0 : 6.2),
    camTarget.z - Math.cos(cameraYaw) * distance
  );
  camera.position.lerp(camDesired, lerpFactor * 0.8);
  camera.lookAt(camTarget);
}

function getDistrict(x, z){
  if(Math.abs(x) < 35 && Math.abs(z) < 35) return "Central Ibadan";
  if(x < 0 && z < 0) return "Bodija / UI";
  if(x > 0 && z < 0) return "Mokola";
  if(x < 0 && z > 0) return "Mapo / Dugbe";
  return "Challenge / Ring Road";
}


/* =========================================================
   TIME OF DAY
========================================================= */

let lastMinuteTick = 0;

const skyNightTop = new THREE.Color(0x05091a);
const skyDayTop   = new THREE.Color(0x2e79c0);
const skyNightBot = new THREE.Color(0x101d33);
const skyDayBot   = new THREE.Color(0xcfe2f0);
const skySunset   = new THREE.Color(0xff9a52);

const tmpTop = new THREE.Color();
const tmpBot = new THREE.Color();

function updateTime(dt){
  lastMinuteTick += dt;
  if(lastMinuteTick < 1) return;
  lastMinuteTick = 0;

  state.minutes++;
  if(state.minutes >= 1440){
    state.minutes = 0;
    state.day++;
  }

  const t = (state.minutes - 360) / 720;
  const daylight = clamp(Math.sin(Math.PI * t), 0, 1);
  const sunset = Math.max(0, 1 - Math.abs(daylight - 0.2) / 0.2);

  tmpTop.copy(skyNightTop).lerp(skyDayTop, daylight);
  tmpBot.copy(skyNightBot).lerp(skyDayBot, daylight);
  tmpBot.lerp(skySunset, sunset * 0.6);

  skyUniforms.topColor.value.copy(tmpTop);
  skyUniforms.bottomColor.value.copy(tmpBot);
  scene.fog.color.copy(tmpBot).lerp(tmpTop, 0.5);

  if(state.inside){
    sun.intensity = 0.35 + 0.35 * daylight;
    ambient.intensity = 0.5;
    fill.intensity = 0.15;
  }else{
    sun.intensity = 0.35 + 2.3 * daylight;
    ambient.intensity = 0.42 + 1.05 * daylight;
    fill.intensity = 0.12 + 0.28 * daylight;
  }

  renderer.toneMappingExposure = 0.92 + 0.16 * daylight;

  sun.position.copy(player.position).add(sunOffset);
  sun.target.position.copy(player.position);
  sun.target.updateMatrixWorld();

  const lampOn = daylight < 0.28;
  for(const l of lamps){
    l.intensity = lampOn ? 2.6 : 0;
  }

  if(state.hunger < 10) state.health = clamp(state.health - 0.03);
  if(state.energy < 8)  state.health = clamp(state.health - 0.02);
}

function timeText(){
  const h = Math.floor(state.minutes / 60);
  const m = state.minutes % 60;
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
}


/* =========================================================
   XP
========================================================= */

function xp(amount){
  state.xp += amount;
  while(state.xp >= state.level * 100){
    state.xp -= state.level * 100;
    state.level++;
    showHintToast("⭐ LEVEL UP! You are now Level " + state.level);
  }
}


/* =========================================================
   HINTS
========================================================= */

let hintTimer = 0;

function setHint(text){ $("hint").textContent = text; }
function showHintToast(text){ setHint(text); hintTimer = 3.2; }

function updateHint(dt){
  if(hintTimer > 0){ hintTimer -= dt; return; }

  if(state.inside){
    const d = Math.hypot(player.position.x, player.position.z - 11.15);
    if(d < 4.5){
      setHint("🚪 Walk to the red door and press ACTION to exit.");
    }else{
      const b = buildings.find(x => x.id === state.building);
      setHint("Inside " + (b?.name || "building") + " — press ACTION for activities.");
    }
    return;
  }

  if(state.driving){
    setHint("🚗 Driving — joystick to move, CAR to exit.");
    return;
  }

  const building = nearestBuilding();
  const vehicle = nearestVehicle();

  if(building){
    setHint("🚪 " + building.name + " — press ACTION to enter");
  }else if(vehicle){
    setHint("🚗 " + (vehicle.userData.carName || "vehicle") + " — press CAR to board");
  }else{
    setHint("Explore Ibadan — find a job, eat, sleep, drive and build your life.");
  }
}


/* =========================================================
   ACTIVITIES
========================================================= */

function performAction(){

  if(state.inside){
    if(Math.hypot(player.position.x, player.position.z - 11.15) < 4.5){
      exitBuilding();
      return;
    }
    showModal("Activity", "Choose something to do inside.", [
      { label:"🍗 Eat",      action: eat },
      { label:"🚿 Shower",   action: shower },
      { label:"😴 Sleep",    action: sleep },
      { label:"📚 Study",    action: study }
    ]);
    return;
  }

  if(state.driving){
    setHint("You are driving. Tap CAR to leave the vehicle.");
    return;
  }

  const building = nearestBuilding();
  const vehicle = nearestVehicle();

  if(building){ enterBuilding(building); return; }
  if(vehicle){ enterVehicle(vehicle); return; }

  showModal("Life Activity", "What do you want to do?", [
    { label:"🍛 Eat",        action: eat },
    { label:"🚿 Freshen Up", action: shower },
    { label:"💼 Work",       action: work },
    { label:"🤝 Socialize",  action: socialize },
    { label:"📚 Study",      action: study }
  ]);
}

function eat(){
  if(state.cash < 800){ showHintToast("Not enough cash for food."); return; }
  state.cash -= 800;
  state.hunger = clamp(state.hunger + 30);
  state.fun = clamp(state.fun + 5);
  xp(8);
  showHintToast("🍛 You ate a proper Ibadan meal. −₦800");
}

function shower(){
  state.hygiene = clamp(state.hygiene + 40);
  state.fun = clamp(state.fun + 3);
  xp(5);
  showHintToast("🚿 Fresh and clean.");
}

function sleep(){
  state.energy = clamp(state.energy + 55);
  state.health = clamp(state.health + 10);
  state.minutes += 240;
  if(state.minutes >= 1440){ state.minutes -= 1440; state.day++; }
  xp(10);
  showHintToast("😴 You slept and recovered.");
}

function study(){
  if(state.energy < 12){ showHintToast("Too tired to study. Sleep first."); return; }
  state.energy = clamp(state.energy - 12);
  state.fun = clamp(state.fun - 3);
  xp(20);
  showHintToast("📚 Study session complete. +20 XP");
}

function socialize(){
  state.social = clamp(state.social + 22);
  state.fun = clamp(state.fun + 10);
  state.cash = Math.max(0, state.cash - 300);
  xp(12);
  showHintToast("🤝 You linked up with people. −₦300");
}

function work(){
  if(state.job === "Unemployed"){
    showModal("No Job", "Choose a job from your phone first.", [
      { label:"Open Jobs", action: openJobs }
    ]);
    return;
  }
  if(state.energy < 20){ showHintToast("You need more energy for work."); return; }
  state.energy = clamp(state.energy - 20);
  state.hunger = clamp(state.hunger - 12);
  state.cash += state.jobPay;
  state.minutes += 120;
  if(state.minutes >= 1440){ state.minutes -= 1440; state.day++; }
  xp(30);
  showHintToast("💼 Shift completed: +" + money(state.jobPay));
}


/* =========================================================
   MODALS
========================================================= */

function showModal(title, text, buttons = []){
  $("modalTitle").textContent = title;
  $("modalText").textContent = text;
  const box = $("modalButtons");
  box.innerHTML = "";
  for(const item of buttons){
    const btn = document.createElement("button");
    btn.className = "tile";
    btn.innerHTML = item.label || "Choose";
    btn.onclick = () => {
      try{ if(item.action) item.action(); }
      finally{ closeModal(); }
    };
    box.appendChild(btn);
  }
  $("modal").style.display = "flex";
}

function closeModal(){ $("modal").style.display = "none"; }
function closePhone(){ $("phone").style.display = "none"; }

$("closeModal").onclick = closeModal;
$("closePhone").onclick = closePhone;


/* =========================================================
   JOBS
========================================================= */

const jobs = [
  ["Buka Attendant", 1200],
  ["Market Trader", 2200],
  ["Danfo Driver", 3000],
  ["Security Officer", 2800],
  ["Teacher", 4500],
  ["Nurse", 5200],
  ["Software Developer", 8500],
  ["Bank Officer", 6500],
  ["Content Creator", 7000]
];

function openJobs(){
  showModal(
    "💼 Jobs",
    "Pick a career. Your pay is added after each shift.",
    jobs.map(job => ({
      label:
        "<strong>" + job[0] + "</strong><br><small>" +
        money(job[1]) + " per shift</small>",
      action: () => {
        state.job = job[0];
        state.jobPay = job[1];
        xp(5);
        showHintToast("Job selected: " + job[0]);
      }
    }))
  );
}


/* =========================================================
   FURNITURE
========================================================= */

const furniture = [
  ["🛋️ Sofa",     "sofa",     25000],
  ["🛏️ Bed",      "bed",      30000],
  ["📺 TV",       "tv",       45000],
  ["🪴 Plant",    "plant",     8000],
  ["🧊 Fridge",   "fridge",   55000],
  ["🖥️ Desk",     "desk",     22000],
  ["👕 Wardrobe", "wardrobe", 35000],
  ["🪵 Table",    "table",    15000]
];

function addFurniture(type, cost, label){
  if(state.cash < cost){ showHintToast("Not enough cash."); return; }
  state.cash -= cost;
  state.furniture.push({
    type, label,
    x: Math.random() * 16 - 8,
    z: Math.random() * 12 - 4,
    rot: 0
  });
  xp(6);
  showHintToast(label + " added to your house.");
  if(state.inside) renderInteriorFurniture();
}

function decorate(){
  showModal(
    "🏠 Decorate House",
    "Buy furniture. Items are saved with your game.",
    furniture.map(f => ({
      label: "<strong>" + f[0] + "</strong><br><small>" + money(f[2]) + "</small>",
      action: () => addFurniture(f[1], f[2], f[0])
    }))
  );
}


/* =========================================================
   MAP
========================================================= */

function showMap(){
  showModal(
    "🗺️ Ibadan Map",
    "Fast travel costs ₦500 and works when you are outside.",
    buildings.map(b => ({
      label: "📍 " + b.name,
      action: () => travelTo(b)
    }))
  );
}

function travelTo(b){
  if(state.inside || state.driving){
    showHintToast("Exit your current building/vehicle first.");
    return;
  }
  if(state.cash < 500){
    showHintToast("Fast travel costs ₦500.");
    return;
  }
  state.cash -= 500;
  player.position.set(b.door[0] + 2, 0, b.door[1]);
  state.location = b.name;
  showHintToast("Travelled to " + b.name + " −₦500");
}


/* =========================================================
   STATS / HELP
========================================================= */

function stats(){
  showModal("📊 Life Stats", "Your current progress.", [
    { label: "💰 Cash " + money(state.cash), action: () => {} },
    { label: "🏦 Bank " + money(state.bank), action: () => {} },
    { label: "⭐ Level " + state.level + " — " + state.xp + " XP", action: () => {} },
    { label: "💼 " + state.job, action: () => {} },
    { label: "🏠 Furniture " + state.furniture.length, action: () => {} }
  ]);
}

function help(){
  showModal(
    "🎮 Controls",
    "Mobile: joystick = move, RUN = sprint, ACTION = enter/interact, CAR = board/exit vehicle, CAM = camera. Swipe the world to look around. Keyboard: WASD/arrows, Shift, E, F, Q.",
    []
  );
}


/* =========================================================
   SAVE
========================================================= */

function saveGame(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn("Save failed", e); }
}


/* =========================================================
   PHONE MENU
========================================================= */

$("phoneBtn").onclick = () => { $("phone").style.display = "flex"; };

for(const button of document.querySelectorAll("[data-phone]")){
  button.onclick = () => {
    const action = button.dataset.phone;
    closePhone();
    if(action === "map")      showMap();
    if(action === "jobs")     openJobs();
    if(action === "decorate") decorate();
    if(action === "stats")    stats();
    if(action === "save"){ saveGame(); showHintToast("💾 Game saved."); }
    if(action === "help") help();
  };
}


/* =========================================================
   BUTTONS
========================================================= */

$("actionBtn").onclick = performAction;

$("carBtn").onclick = () => {
  if(state.driving){ exitVehicle(); return; }
  const vehicle = nearestVehicle();
  if(vehicle) enterVehicle(vehicle);
  else showHintToast("No vehicle nearby.");
};

$("camBtn").onclick = () => {
  cameraMode = (cameraMode + 1) % 2;
  state.cameraMode = cameraMode;
  showHintToast(cameraMode ? "Camera: close" : "Camera: normal");
};


/* =========================================================
   HUD
========================================================= */

const meterIds = ["health","hunger","energy","hygiene","fun"];

function updateHUD(){
  $("cash").textContent = money(state.cash);
  $("bank").textContent = money(state.bank);
  $("level").textContent = "Lv " + state.level;
  $("time").textContent = timeText();
  $("xpbar").style.width = clamp(state.xp / (state.level * 100) * 100) + "%";
  $("location").textContent = state.inside
    ? (buildings.find(b => b.id === state.building)?.name || "Building")
    : state.location;

  for(const key of meterIds){
    const el = $(key);
    const v = clamp(state[key]);
    el.style.width = v + "%";
    el.classList.toggle("warn", v < 45 && v >= 20);
    el.classList.toggle("bad", v < 20);
  }
}


/* =========================================================
   BOOT
========================================================= */

async function boot(){

  $("loadbar").style.width = "18%";
  await loadPlayer();
  $("loadbar").style.width = "55%";
  await loadRealCar();
  $("loadbar").style.width = "85%";

  if(state.inside){
    state.inside = false;
    state.building = null;
  }

  player.position.set(state.lastOutside.x, 0, state.lastOutside.z);
  player.rotation.y = state.lastOutside.rot || 0;
  state.location = getDistrict(player.position.x, player.position.z);

  cameraYaw = 0;
  camera.position.set(
    player.position.x,
    player.position.y + 7,
    player.position.z + 12
  );

  $("loadbar").style.width = "100%";

  setTimeout(() => {
    const l = $("loading");
    l.style.opacity = "0";
    setTimeout(() => { l.style.display = "none"; }, 520);
  }, 220);

  saveGame();
}


/* =========================================================
   MAIN LOOP
========================================================= */

const clock = new THREE.Clock();
let hudAccumulator = 0;

function loop(){
  const dt = Math.min(clock.getDelta(), 0.05);

  updateTime(dt);
  updatePlayer(dt);
  updateDriving(dt);
  updateNPCs(dt);
  updateTraffic(dt);
  updateCamera(dt);
  updateHint(dt);

  if(playerMixer) playerMixer.update(dt);

  sky.position.copy(camera.position);

  hudAccumulator += dt;
  if(hudAccumulator > 0.066){
    hudAccumulator = 0;
    updateHUD();
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}


/* =========================================================
   RESIZE
========================================================= */

let resizeTimer = null;

window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const w = innerWidth, h = innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(w, h);
  }, 90);
});

window.addEventListener("orientationchange", () => {
  setTimeout(() => window.dispatchEvent(new Event("resize")), 260);
});


/* =========================================================
   AUTOSAVE
========================================================= */

window.addEventListener("beforeunload", saveGame);
setInterval(saveGame, 30000);


/* =========================================================
   START
========================================================= */

boot()
  .then(() => loop())
  .catch(err => {
    console.error(err);
    $("loadbar").style.width = "100%";
    $("loading").style.display = "none";
    setHint("Game loaded with fallback 3D assets.");
    loop();
  });

</script>

</body>
</html>
