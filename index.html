<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Ibadan Life 3D — GTA Style Life Simulator</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050914;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#loading{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 30%,#163b55 0,#07111f 45%,#03060b 100%);
  color:white;
}

.logo{
  font-size:34px;
  font-weight:1000;
  letter-spacing:-1px;
}

.logo span{color:#39e58c}

.loadingText{
  margin-top:10px;
  opacity:.75;
  font-size:13px;
}

.loader{
  width:220px;
  height:7px;
  margin-top:22px;
  border-radius:99px;
  overflow:hidden;
  background:#ffffff18;
}

.loader i{
  display:block;
  width:35%;
  height:100%;
  background:#39e58c;
  border-radius:99px;
  animation:load 1.2s infinite ease-in-out;
}

@keyframes load{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(650%)}
}

#hud{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:20;
  pointer-events:none;
  padding:
    max(10px,env(safe-area-inset-top))
    10px 0;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.playerCard{
  min-width:165px;
  padding:9px 11px;
  border:1px solid #ffffff18;
  border-radius:14px;
  background:#07111fd9;
  backdrop-filter:blur(10px);
  box-shadow:0 8px 30px #0005;
}

.playerName{
  font-weight:900;
  font-size:14px;
}

.money{
  margin-top:2px;
  color:#48ee99;
  font-weight:900;
  font-size:13px;
}

.statuses{
  display:flex;
  gap:5px;
  margin-top:7px;
  flex-wrap:wrap;
}

.stat{
  font-size:10px;
  padding:3px 6px;
  border-radius:7px;
  background:#ffffff0c;
  color:#dbe7ef;
}

.rightHud{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:5px;
}

.clock{
  padding:7px 10px;
  border-radius:10px;
  background:#07111fd9;
  border:1px solid #ffffff18;
  font-size:12px;
  font-weight:900;
}

.location{
  padding:6px 9px;
  border-radius:9px;
  background:#07111fd9;
  border:1px solid #ffffff18;
  font-size:10px;
  color:#8fe7ff;
  max-width:190px;
  text-align:right;
}

#hint{
  position:fixed;
  left:50%;
  bottom:145px;
  transform:translateX(-50%);
  z-index:30;
  pointer-events:none;
  max-width:92vw;
  padding:9px 14px;
  border-radius:12px;
  background:#050914df;
  border:1px solid #ffffff20;
  color:white;
  font-size:12px;
  font-weight:800;
  text-align:center;
  opacity:0;
  transition:.2s;
}

#hint.show{opacity:1}

#joystick{
  position:fixed;
  left:18px;
  bottom:22px;
  width:122px;
  height:122px;
  z-index:40;
  border-radius:50%;
  background:#ffffff0b;
  border:1px solid #ffffff18;
  box-shadow:0 10px 30px #0004;
}

#stick{
  position:absolute;
  left:50%;
  top:50%;
  width:56px;
  height:56px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#ffffff20;
  border:1px solid #ffffff35;
  box-shadow:0 5px 18px #0005;
}

#actions{
  position:fixed;
  right:15px;
  bottom:20px;
  z-index:40;
  display:grid;
  grid-template-columns:repeat(2,62px);
  gap:9px;
}

.action{
  width:62px;
  height:62px;
  border-radius:50%;
  border:1px solid #ffffff25;
  color:white;
  background:#07111fd9;
  box-shadow:0 8px 24px #0006;
  font-weight:1000;
  font-size:11px;
}

.action:active{
  transform:scale(.93);
  background:#16324b;
}

#phoneBtn{
  position:fixed;
  right:15px;
  top:95px;
  z-index:40;
  width:52px;
  height:52px;
  border-radius:15px;
  border:1px solid #ffffff20;
  background:#07111fd9;
  color:white;
  font-size:21px;
}

#crosshair{
  position:fixed;
  left:50%;
  top:50%;
  z-index:15;
  transform:translate(-50%,-50%);
  width:6px;
  height:6px;
  border:1px solid #ffffffaa;
  border-radius:50%;
  pointer-events:none;
}

#phone{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:#0008;
}

.phonePanel{
  width:min(480px,100%);
  min-height:58vh;
  padding:18px;
  border-radius:25px 25px 0 0;
  background:
    linear-gradient(160deg,#0d1d2c,#07111b);
  border:1px solid #ffffff18;
  box-shadow:0 -20px 60px #0009;
  color:white;
}

.phoneHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.phoneTitle{
  font-weight:1000;
  font-size:21px;
}

.close{
  border:0;
  background:#ffffff10;
  color:white;
  width:38px;
  height:38px;
  border-radius:12px;
  font-size:18px;
}

.phoneGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.phoneItem{
  min-height:82px;
  border:1px solid #ffffff14;
  border-radius:16px;
  background:#ffffff08;
  color:white;
  font-weight:800;
}

.phoneItem b{
  display:block;
  font-size:25px;
  margin-bottom:5px;
}

#modal{
  position:fixed;
  inset:0;
  z-index:150;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#0009;
}

.modalBox{
  width:min(440px,100%);
  max-height:80vh;
  overflow:auto;
  border-radius:22px;
  padding:20px;
  background:#0a1724;
  color:white;
  border:1px solid #ffffff18;
  box-shadow:0 20px 70px #000;
}

.modalBox h2{
  margin-top:0;
}

.modalText{
  color:#c6d5df;
  line-height:1.55;
  font-size:14px;
}

.modalBtn{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:#1a3950;
  color:white;
  font-weight:900;
}

.modalBtn.primary{
  background:#20c977;
  color:#04120b;
}

#driveBadge{
  position:fixed;
  left:50%;
  top:92px;
  transform:translateX(-50%);
  z-index:25;
  display:none;
  padding:8px 13px;
  border-radius:12px;
  background:#101d29dd;
  border:1px solid #4de99955;
  color:#8fffbf;
  font-size:12px;
  font-weight:1000;
}

@media(min-width:800px){
  #actions{
    grid-template-columns:repeat(4,62px);
  }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
  <div class="logo">IBADAN <span>LIFE</span></div>
  <div class="loadingText" id="loadingText">Loading Ibadan...</div>
  <div class="loader"><i></i></div>
</div>

<div id="hud">
  <div class="topbar">
    <div class="playerCard">
      <div class="playerName" id="playerName">David</div>
      <div class="money" id="money">₦50,000</div>
      <div class="statuses">
        <span class="stat" id="health">❤️ 100</span>
        <span class="stat" id="energy">⚡ 100</span>
        <span class="stat" id="hunger">🍗 100</span>
        <span class="stat" id="hygiene">🧼 100</span>
      </div>
    </div>

    <div class="rightHud">
      <div class="clock" id="clock">MON 08:00</div>
      <div class="location" id="location">Your House</div>
    </div>
  </div>
</div>

<div id="crosshair"></div>
<div id="driveBadge">🚗 DRIVING — Swipe to look • EXIT to leave</div>
<div id="hint"></div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="actions">
  <button class="action" id="actionBtn">ACTION</button>
  <button class="action" id="carBtn">CAR</button>
  <button class="action" id="runBtn">RUN</button>
  <button class="action" id="exitBtn">EXIT</button>
</div>

<button id="phoneBtn">📱</button>

<div id="phone">
  <div class="phonePanel">
    <div class="phoneHead">
      <div class="phoneTitle">📱 David's Phone</div>
      <button class="close" id="phoneClose">×</button>
    </div>

    <div class="phoneGrid">
      <button class="phoneItem" data-phone="map"><b>🗺️</b>Map</button>
      <button class="phoneItem" data-phone="jobs"><b>💼</b>Jobs</button>
      <button class="phoneItem" data-phone="house"><b>🏠</b>House</button>
      <button class="phoneItem" data-phone="car"><b>🚗</b>Cars</button>
      <button class="phoneItem" data-phone="stats"><b>📊</b>Stats</button>
      <button class="phoneItem" data-phone="decorate"><b>🛋️</b>Decorate</button>
    </div>
  </div>
</div>

<div id="modal">
  <div class="modalBox">
    <h2 id="modalTitle">Ibadan Life</h2>
    <div class="modalText" id="modalText"></div>
    <div id="modalButtons"></div>
    <button class="modalBtn" id="modalClose">CLOSE</button>
  </div>
</div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";

/* =========================================================
   IBADAN LIFE 3D
   SINGLE-FILE MOBILE GTA-STYLE LIFE SIMULATOR
========================================================= */

const SAVE_KEY = "IBADAN_LIFE_3D_V3";

const state = JSON.parse(localStorage.getItem(SAVE_KEY) || "null") || {
  name:"David",
  cash:50000,
  bank:120000,
  health:100,
  hunger:100,
  energy:100,
  hygiene:100,
  social:100,
  fun:100,
  day:1,
  minutes:8*60,
  weather:"Sunny",
  location:"Your House",
  job:"Unemployed",
  jobPay:0,
  inside:false,
  building:null,
  driving:false,
  ownedCar:"Toyota Corolla",
  furniture:[],
  xp:0,
  level:1,
  totalEarned:0,
  totalSpent:0,
  lastOutside:{
    x:-50,
    z:-34,
    yaw:0
  }
};

/* =========================================================
   THREE SETUP
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x8cc8e8);

scene.fog = new THREE.FogExp2(
  0x8cc8e8,
  0.0022
);

const camera = new THREE.PerspectiveCamera(
  62,
  innerWidth/innerHeight,
  0.1,
  1200
);

camera.position.set(-62,12,-48);

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.7)
);

renderer.setSize(innerWidth,innerHeight);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

document.getElementById("game").appendChild(renderer.domElement);

/* =========================================================
   LIGHTING
========================================================= */

const hemi = new THREE.HemisphereLight(
  0xcfefff,
  0x32422e,
  1.4
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(
  0xffffff,
  2.2
);

sun.position.set(-120,180,80);
sun.castShadow = true;

sun.shadow.mapSize.set(2048,2048);

sun.shadow.camera.left = -300;
sun.shadow.camera.right = 300;
sun.shadow.camera.top = 300;
sun.shadow.camera.bottom = -300;

scene.add(sun);

/* =========================================================
   GROUPS
========================================================= */

const world = new THREE.Group();
const interiorWorld = new THREE.Group();

scene.add(world);
scene.add(interiorWorld);

interiorWorld.visible = false;

/* =========================================================
   HELPERS
========================================================= */

const loader = new GLTFLoader();

function mat(color,roughness=.8,metalness=0){
  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness
  });
}

function box(
  w,
  h,
  d,
  color,
  x=0,
  y=0,
  z=0
){
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    mat(color)
  );

  m.position.set(x,y,z);
  m.castShadow=true;
  m.receiveShadow=true;

  return m;
}

function cylinder(
  r,
  h,
  color,
  x=0,
  y=0,
  z=0
){
  const m = new THREE.Mesh(
    new THREE.CylinderGeometry(r,r,h,16),
    mat(color)
  );

  m.position.set(x,y,z);
  m.castShadow=true;
  m.receiveShadow=true;

  return m;
}

function formatMoney(n){
  return "₦"+Math.round(n).toLocaleString();
}

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function distance2D(a,b){
  return Math.hypot(
    a.x-b.x,
    a.z-b.z
  );
}

function saveGame(){
  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(state)
  );
}

/* =========================================================
   GROUND
========================================================= */

const ground = box(
  550,
  1,
  550,
  0x4e7747,
  0,
  -0.5,
  0
);

world.add(ground);

/* =========================================================
   ROADS
========================================================= */

function createRoad(x,z,w,d){
  const road = box(
    w,
    .12,
    d,
    0x24272b,
    x,
    .02,
    z
  );

  world.add(road);

  /* road edges */
  const edgeMat = mat(0x777777);

  if(w>d){
    for(let i=-w/2;i<w/2;i+=9){
      const line = new THREE.Mesh(
        new THREE.BoxGeometry(4,.025,.18),
        edgeMat
      );

      line.position.set(
        x+i,
        .09,
        z
      );

      world.add(line);
    }
  }else{
    for(let i=-d/2;i<d/2;i+=9){
      const line = new THREE.Mesh(
        new THREE.BoxGeometry(.18,.025,4),
        edgeMat
      );

      line.position.set(
        x,
        .09,
        z+i
      );

      world.add(line);
    }
  }
}

createRoad(0,0,550,15);
createRoad(0,70,550,14);
createRoad(0,-70,550,14);
createRoad(0,0,15,550);
createRoad(70,0,14,550);
createRoad(-70,0,14,550);

/* sidewalks */

function sidewalk(x,z,w,d){
  const s = box(
    w,
    .18,
    d,
    0x999b96,
    x,
    .08,
    z
  );

  world.add(s);
}

sidewalk(0,10,550,5);
sidewalk(0,-10,550,5);
sidewalk(10,0,5,550);
sidewalk(-10,0,5,550);

/* =========================================================
   BUILDINGS
========================================================= */

const buildings = [];

function createBuilding(
  id,
  name,
  x,
  z,
  w,
  d,
  h,
  color
){

  const group = new THREE.Group();

  const body = box(
    w,
    h,
    d,
    color,
    0,
    h/2,
    0
  );

  group.add(body);

  /* roof */
  const roof = box(
    w+1,
    .8,
    d+1,
    0x34363b,
    0,
    h+.4,
    0
  );

  group.add(roof);

  /* windows */
  const windowMat = mat(0x8dd7ee,.25,.25);

  for(let wx=-w/2+4; wx<w/2-2; wx+=5){
    const win = new THREE.Mesh(
      new THREE.BoxGeometry(
        1.7,
        2.1,
        .08
      ),
      windowMat
    );

    win.position.set(
      wx,
      h*.62,
      d/2+.05
    );

    group.add(win);
  }

  /* front door */
  const door = new THREE.Mesh(
    new THREE.BoxGeometry(
      2.2,
      3.5,
      .12
    ),
    mat(0x5b3725)
  );

  door.position.set(
    0,
    1.75,
    d/2+.08
  );

  group.add(door);

  /* name sign */
  const sign = new THREE.Mesh(
    new THREE.BoxGeometry(
      Math.min(w-4,18),
      1.2,
      .18
    ),
    mat(0x20252b)
  );

  sign.position.set(
    0,
    h*.84,
    d/2+.13
  );

  group.add(sign);

  group.position.set(x,0,z);

  world.add(group);

  const b = {
    id,
    name,
    x,
    z,
    w,
    d,
    h,
    group
  };

  buildings.push(b);

  return b;
}

createBuilding(
  "house",
  "Your House",
  -50,
  -48,
  24,
  22,
  12,
  0xc58e61
);

createBuilding(
  "market",
  "Bodija Market",
  55,
  -45,
  34,
  25,
  10,
  0xd2b15d
);

createBuilding(
  "hostel",
  "University Hostel",
  -48,
  48,
  28,
  24,
  15,
  0xb9c1ca
);

createBuilding(
  "hotel",
  "Mokola Hotel",
  48,
  48,
  30,
  26,
  20,
  0x728ba1
);

createBuilding(
  "shopping",
  "Dugbe Shopping Centre",
  125,
  0,
  36,
  30,
  16,
  0x7d8d99
);

createBuilding(
  "hospital",
  "General Hospital",
  -125,
  0,
  36,
  30,
  18,
  0xe8e8e8
);

createBuilding(
  "bank",
  "First City Bank",
  0,
  125,
  32,
  24,
  12,
  0x4c687b
);

createBuilding(
  "restaurant",
  "Mama's Kitchen",
  0,
  -125,
  30,
  24,
  10,
  0xc17c4d
);

/* =========================================================
   TREES
========================================================= */

function createTree(x,z,scale=1){

  const g = new THREE.Group();

  const trunk = cylinder(
    .55,
    4,
    0x68472d
  );

  trunk.position.y=2;

  g.add(trunk);

  const crown = new THREE.Mesh(
    new THREE.SphereGeometry(
      3.3,
      12,
      10
    ),
    mat(0x2d733d)
  );

  crown.position.y=6;

  crown.castShadow=true;

  g.add(crown);

  g.position.set(x,0,z);
  g.scale.setScalar(scale);

  world.add(g);
}

const treePositions=[
  [-180,-160,1.2],
  [-150,-110,.9],
  [-180,160,1.1],
  [-100,175,.8],
  [165,-160,1.2],
  [190,-110,.9],
  [180,155,1.1],
  [115,180,.9],
  [-200,40,1],
  [205,50,1],
  [-40,200,.8],
  [40,-200,1]
];

treePositions.forEach(t=>createTree(...t));

/* =========================================================
   STREET LIGHTS
========================================================= */

function streetLight(x,z){

  const g = new THREE.Group();

  const pole = cylinder(
    .12,
    7,
    0x25282b
  );

  pole.position.y=3.5;

  g.add(pole);

  const arm = box(
    2.2,
    .12,
    .12,
    0x25282b,
    1,
    6.9,
    0
  );

  g.add(arm);

  const lamp = new THREE.Mesh(
    new THREE.SphereGeometry(.25,10,8),
    new THREE.MeshStandardMaterial({
      color:0xffe6a3,
      emissive:0xffb52e,
      emissiveIntensity:1.8
    })
  );

  lamp.position.set(2,6.7,0);

  g.add(lamp);

  g.position.set(x,0,z);

  world.add(g);
}

for(let i=-220;i<=220;i+=55){
  streetLight(i,12);
  streetLight(i,-12);
  streetLight(12,i);
  streetLight(-12,i);
}

/* =========================================================
   PLAYER FALLBACK MODEL
========================================================= */

function createFallbackHuman(){

  const g = new THREE.Group();

  g.userData.fallback=true;

  const skin=mat(0x7b4a2d);
  const shirt=mat(0x1677a9);
  const pants=mat(0x172033);
  const shoes=mat(0x151515);

  const torso=box(
    1.25,
    1.7,
    .7,
    0x1677a9
  );

  torso.position.y=2.5;
  torso.material=shirt;

  g.add(torso);

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(
      .52,
      16,
      12
    ),
    skin
  );

  head.position.y=3.75;

let playerGLTF=null;

let playerActions={};
let activePlayerAction=null;

const PLAYER_URL =
  "https://threejs.org/examples/models/gltf/Soldier.glb";

function findAction(names){

  for(const n of names){

    const key=Object.keys(playerActions)
      .find(k=>k.toLowerCase()===n.toLowerCase());

    if(key) return playerActions[key];
  }

  const first=Object.keys(playerActions)[0];

  return first ? playerActions[first] : null;
}

function setPlayerAction(names){

  const action=findAction(names);

  if(!action || action===activePlayerAction)
    return;

  if(activePlayerAction)
    activePlayerAction.fadeOut(.18);

  action.reset();
  action.fadeIn(.18);
  action.play();

  activePlayerAction=action;
}

  try{

    const gltf=await loader.loadAsync(
      PLAYER_URL

    real.traverse(o=>{

    real.rotation.copy(player.rotation);

/* =========================================================
   BUILDING COLLISION
========================================================= */

function buildingContains(
  b,
  x,
  z,
  margin=1
){

  return (
    x>b.x-b.w/2-margin &&
    x<b.x+b.w/2+margin &&
    z>b.z-b.d/2-margin &&
    z<b.z+b.d/2+margin
  );
}

function isNearDoor(
  b,
  x,
  z
){

  const doorX=b.x;
  const doorZ=b.z+b.d/2+2.2;

  return Math.hypot(
    x-doorX,
    z-doorZ
  )<5.5;
}

function nearestBuilding(){

  let best=null;
  let bestDist=Infinity;

  for(const b of buildings){

    const door={
      x:b.x,
      z:b.z+b.d/2+2.2
    };

    const d=Math.hypot(
      player.position.x-door.x,
      player.position.z-door.z
    );

    if(d<bestDist){

      bestDist=d;
      best=b;
    }
  }

  return bestDist<6 ? best:null;
}

/* =========================================================
   INTERIOR COLLISION
========================================================= */

function constrainInterior(){

  const x=player.position.x;
  const z=player.position.z;

  const halfW=13.3;
  const halfD=10.8;

  player.position.x=
    clamp(
      x,
      -halfW,
      halfW
    );

  /* keep exit opening */
  if(z>halfD){

    if(Math.abs(player.position.x)>2.7){

      player.position.z=halfD;

    }else{

      player.position.z=
        Math.min(z,11.5);

    }
  }

  player.position.z=
    clamp(
      player.position.z,
      -halfD,
      11.4
    );
}

/* =========================================================
   OUTSIDE COLLISION
========================================================= */

function canMoveOutside(
  x,
  z
){

  if(
    x<-270 ||
    x>270 ||
    z<-270 ||
    z>270
  ) return false;

  for(const b of buildings){

    if(buildingContains(
      b,
      x,
      z,
      .9
    )){

      if(isNearDoor(
        b,
        x,
        z
      )){

        continue;
      }

      return false;
    }
  }

  return true;
}

const joystick=
  document.getElementById("joystick");

const stick=
  document.getElementById("stick");

let joy={
  active:false,
  id:null,
  x:0,
  y:0
};

function updateJoy(e){

  const r=
    joystick.getBoundingClientRect();

  const cx=
    r.left+r.width/2;

  const cy=
    r.top+r.height/2;

  let dx=e.clientX-cx;
  let dy=e.clientY-cy;

  const max=40;

  const len=Math.hypot(dx,dy);

  if(len>max){

    dx=dx/len*max;
    dy=dy/len*max;
  }

  joy.x=dx/max;
  joy.y=dy/max;

  stick.style.transform=
    `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
}

joystick.addEventListener(
  "pointerdown",
  e=>{

    joy.active=true;
    joy.id=e.pointerId;

    joystick.setPointerCapture(
      e.pointerId
    );

    updateJoy(e);
  }
);

joystick.addEventListener(
  "pointermove",
  e=>{

    if(
      joy.active &&
      joy.id===e.pointerId
    ){

      updateJoy(e);
    }
  }
);

function endJoy(){

  joy.active=false;
  joy.x=0;
  joy.y=0;

  stick.style.transform=
    "translate(-50%,-50%)";
}

joystick.addEventListener(
  "pointerup",
  endJoy
);

joystick.addEventListener(
  "pointercancel",
  endJoy
);

/* =========================================================
   CAMERA SWIPE
========================================================= */

let cameraYaw=0;
let cameraPitch=.38;

let cameraTouch={
  active:false,
  id:null,
  x:0,
  y:0
};

renderer.domElement.addEventListener(
  "pointerdown",
  e=>{

    if(
      e.pointerType==="mouse" &&
      e.button!==0
    ) return;

    cameraTouch.active=true;
    cameraTouch.id=e.pointerId;
    cameraTouch.x=e.clientX;
    cameraTouch.y=e.clientY;

    renderer.domElement.setPointerCapture(
      e.pointerId
    );
  }
);

renderer.domElement.addEventListener(
  "pointermove",
  e=>{

    if(
      !cameraTouch.active ||
      cameraTouch.id!==e.pointerId
    ) return;

    const dx=e.clientX-cameraTouch.x;
    const dy=e.clientY-cameraTouch.y;

    cameraTouch.x=e.clientX;
    cameraTouch.y=e.clientY;

    cameraYaw-=dx*.006;

    cameraPitch=
      clamp(
        cameraPitch+dy*.004,
        .12,
        .72
      );
  }
);

function endCameraTouch(){
  cameraTouch.active=false;
}

renderer.domElement.addEventListener(
  "pointerup",
  endCameraTouch
);

renderer.domElement.addEventListener(
  "pointercancel",
  endCameraTouch
);

/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function movePlayer(dt){

  const inputX=joy.x;
  const inputY=joy.y;

  const strength=
    Math.min(
      1,
      Math.hypot(
        inputX,
        inputY
      )
    );

  if(strength<.08){

    if(!state.driving)
      setPlayerAction(["Idle","idle"]);

    return;
  }

  const speed=
    (running?10:5.3)*dt*strength;

  if(state.inside){

    const nx=
      player.position.x+
      inputX*speed;

    const nz=
      player.position.z+
      inputY*speed;

    player.position.x=nx;
    player.position.z=nz;

    constrainInterior();

  }else{

    /*
      Movement is screen-relative:
      joystick up = forward relative to camera.
    */

    const forward=
      new THREE.Vector3(
        Math.sin(cameraYaw),
        0,
        Math.cos(cameraYaw)
      );

    const right=
      new THREE.Vector3(
        forward.z,
        0,
        -forward.x
      );

    const movement=
      new THREE.Vector3();

    movement
      .addScaledVector(
        right,
        inputX
      )
      .addScaledVector(
        forward,
        inputY
      );

    movement.normalize();

    const nx=
      player.position.x+
      movement.x*speed;

    const nz=
      player.position.z+
      movement.z*speed;

    if(
      canMoveOutside(nx,nz)
    ){

      player.position.x=nx;
      player.position.z=nz;

    }

    if(
      movement.lengthSq()>.001
    ){

      const targetYaw=
        Math.atan2(
          movement.x,
          movement.z
        );

      player.rotation.y=
        THREE.MathUtils.lerp(
          player.rotation.y,
          targetYaw,
          .25
        );
    }
  }

  if(playerMixer){

    setPlayerAction(
      running
        ?["Run","run","Walk","walk"]
        :["Walk","walk","Run","run"]
    );

  }else{

    animateFallback(
      running?1:0.6
    );
  }
}

function animateFallback(speed){

  if(!player.userData?.fallback)
    return;

  const p=
    player.userData.parts;

  if(!p)
    return;

  const t=
    performance.now()*.012*speed;

  p.leftArm.rotation.x=
    Math.sin(t)*.6;

  p.rightArm.rotation.x=
    -Math.sin(t)*.6;

  p.leftLeg.rotation.x=
    -Math.sin(t)*.65;

  p.rightLeg.rotation.x=
    Math.sin(t)*.65;
}

/* =========================================================
   VEHICLE
========================================================= */

function nearestVehicle(){

  let best=null;
  let bestDist=Infinity;

  for(const car of vehicles){

    if(!car.visible) continue;

    const d=
      distance2D(
        player.position,
        car.position
      );

    if(d<bestDist){

      bestDist=d;
      best=car;
    }
  }

  return bestDist<8 ? best:null;
}

function enterVehicle(car){

  if(!car) return;

  if(state.inside)
    return;

  state.driving=true;

  car.userData.occupied=true;
  car.userData.driver=true;

  player.visible=false;

  player.position.copy(
    car.position
  );

  cameraYaw=
    car.rotation.y;

  state.location=
    car.userData.name || "Vehicle";

  document.getElementById(
    "driveBadge"
  ).style.display="block";

  showHint(
    "🚗 Driving • Use joystick to drive • EXIT to leave"
  );
}

function exitVehicle(){

  if(!state.driving)
    return;

  const car=
    vehicles.find(
      v=>v.userData?.driver
    );

  if(!car){

    state.driving=false;
    player.visible=true;

    return;
  }

  const side=
    new THREE.Vector3(
      1.8,
      0,
      0
    );

  side.applyQuaternion(
    car.quaternion
  );

  player.position.copy(
    car.position
  ).add(side);

  player.position.y=0;

  player.rotation.y=
    car.rotation.y;

  car.userData.driver=false;
  car.userData.occupied=false;

  player.visible=true;

  state.driving=false;

  document.getElementById(
    "driveBadge"
  ).style.display="none";

  state.location="Outside";

  saveGame();

  showHint(
    "🚶 You left the vehicle"
  );
}

function updateDriving(dt){

  const car=
    vehicles.find(
      v=>v.userData?.driver
    );

  if(!car){

    state.driving=false;
    player.visible=true;

    return;
  }

  const throttle=
    -joy.y;

  const steer=
    joy.x;

  const acceleration=
    throttle*18;

  car.userData.speed=
    car.userData.speed || 0;

  car.userData.speed+=
    acceleration*dt;

  car.userData.speed*=
    Math.pow(.90,dt*8);

  car.userData.speed=
    clamp(
      car.userData.speed,
      -9,
      24
    );

  car.rotation.y-=
    steer*
    dt*
    1.7*
    (0.3+
      Math.min(
        1,
        Math.abs(car.userData.speed)/8
      )
    );

  const forward=
    new THREE.Vector3(
      Math.sin(car.rotation.y),
      0,
      Math.cos(car.rotation.y)
    );

  const next=
    car.position.clone()
      .addScaledVector(
        forward,
        car.userData.speed*dt
      );

  if(
    canMoveOutside(
      next.x,
      next.z
    )
  ){

    car.position.copy(next);

  }else{

    car.userData.speed*=-.25;

  }

  player.position.copy(
    car.position
  );

  player.rotation.y=
    car.rotation.y;

  state.location=
    car.userData.name ||
    "Vehicle";
}

/* =========================================================
   ACTION SYSTEM
========================================================= */

function performAction(){

  if(state.driving){

    exitVehicle();
    return;
  }

  if(state.inside){

    const z=player.position.z;

    if(
      z>8.5 &&
      Math.abs(player.position.x)<3
    ){

      exitBuilding();
      return;
    }

    const b=
      buildings.find(
        b=>b.id===state.building
      );

    if(!b) return;

    switch(b.id){

      case "house":
        showModal(
          "🏠 Your House",
          "Rest, sleep, shower, decorate and manage your home."
        );
        break;

      case "hospital":
        healthCheck();
        break;

      case "restaurant":
        eat();
        break;

      case "market":
        showModal(
          "🛒 Bodija Market",
          "A busy Ibadan market. Buy food, household items and supplies."
        );
        break;

      case "bank":
        showModal(
          "🏦 First City Bank",
          "Bank balance: "+formatMoney(state.bank)
        );
        break;

      default:
        showModal(
          b.name,
          "Explore the building and interact with the environment."
        );
    }

    return;
  }

  const b=
    nearestBuilding();

  if(b){

    enterBuilding(b);
    return;
  }

  const car=
    nearestVehicle();

  if(car){

    enterVehicle(car);
    return;
  }

  /* random useful action */
  eat();
}

/* =========================================================
   ACTIONS
========================================================= */

function eat(){

  if(state.cash<500){

    showHint("💸 You need ₦500 to buy food.");
    return;
  }

  state.cash-=500;
  state.totalSpent+=500;

  state.hunger=
    clamp(
      state.hunger+35,
      0,100
    );

  state.fun=
    clamp(
      state.fun+5,
      0,100
    );

  state.xp+=5;

  saveGame();

  showHint(
    "🍛 You ate a proper meal • Hunger +35"
  );
}

function shower(){

  state.hygiene=
    clamp(
      state.hygiene+50,
      0,100
    );

  saveGame();

  showHint(
    "🚿 Fresh again. Hygiene +50"
  );
}

function sleep(){

  state.energy=
    clamp(
      state.energy+70,
      0,100
    );

  state.hunger=
    clamp(
      state.hunger-10,
      0,100
    );

  advanceMinutes(7*60);

  saveGame();

  showHint(
    "😴 You slept for 7 hours."
  );
}

function healthCheck(){

  state.health=
    clamp(
      state.health+20,
      0,100
    );

  state.energy=
    clamp(
      state.energy-5,
      0,100
    );

  saveGame();

  showHint(
    "🩺 Health check complete • Health +20"
  );
}

/* =========================================================
   TIME
========================================================= */

function advanceMinutes(m){

  state.minutes+=m;

  while(state.minutes>=1440){

    state.minutes-=1440;
    state.day++;

  }
}

function updateTime(dt){

  advanceMinutes(
    dt*.55
  );

  const hour=
    Math.floor(
      state.minutes/60
    );

  const minute=
    Math.floor(
      state.minutes%60
    );

  const isNight=
    hour<6 ||
    hour>=19;

  const targetSky=
    isNight
      ?0x091427
      :(
        hour<8
          ?0x769db5
          :0x8cc8e8
      );

  scene.background.lerp(
    new THREE.Color(targetSky),
    .02
  );

  scene.fog.color.copy(
    scene.background
  );

  if(isNight){

    hemi.intensity=
      THREE.MathUtils.lerp(
        hemi.intensity,
        .42,
        .02
      );

    sun.intensity=
      THREE.MathUtils.lerp(
        sun.intensity,
        .25,
        .02
      );

  }else{

    hemi.intensity=
      THREE.MathUtils.lerp(
        hemi.intensity,
        1.4,
        .02
      );

    sun.intensity=
      THREE.MathUtils.lerp(
        sun.intensity,
        2.2,
        .02
      );
  }
}

/* =========================================================
   NPC MOVEMENT
========================================================= */

function updateNPCs(dt){

  if(state.inside)
    return;

  for(const npc of npcs){

    npc.userData.timer-=dt;

    if(
      npc.userData.timer<=0
    ){

      npc.userData.timer=
        2+Math.random()*6;

      npc.userData.dir=
        Math.random()*Math.PI*2;
    }

    const speed=
      npc.userData.speed;

    const nx=
      npc.position.x+
      Math.sin(
        npc.userData.dir
      )*
      speed*
      dt;

    const nz=
      npc.position.z+
      Math.cos(
        npc.userData.dir
      )*
      speed*
      dt;

    if(
      canMoveOutside(nx,nz)
    ){

      npc.position.x=nx;
      npc.position.z=nz;

    }else{

      npc.userData.dir+=
        Math.PI/2;
    }

    npc.rotation.y=
      npc.userData.dir;

    animateNPC(npc);
  }
}

function animateNPC(npc){

  const p=
    npc.userData.parts;

  if(!p) return;

  const t=
    performance.now()*.008;

  p.leftArm.rotation.x=
    Math.sin(t)*.35;

  p.rightArm.rotation.x=
    -Math.sin(t)*.35;

  p.leftLeg.rotation.x=
    -Math.sin(t)*.4;

  p.rightLeg.rotation.x=
    Math.sin(t)*.4;
}

/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

  let target;

  if(state.inside){

    target=
      new THREE.Vector3(
        player.position.x,
        2.7,
        player.position.z
      );

    const radius=12;

    const x=
      target.x+
      Math.sin(cameraYaw)*
      radius;

    const z=
      target.z+
      Math.cos(cameraYaw)*
      radius;

    const y=
      target.y+
      Math.sin(cameraPitch)*
      radius;

    camera.position.lerp(
      new THREE.Vector3(
        x,y,z
      ),
      .09
    );

    camera.lookAt(
      target.x,
      1.8,
      target.z
    );

    return;
  }

  if(state.driving){

    const car=
      vehicles.find(
        v=>v.userData?.driver
      );

    if(!car) return;

    const forward=
      new THREE.Vector3(
        Math.sin(car.rotation.y),
        0,
        Math.cos(car.rotation.y)
      );

    const desired=
      car.position.clone()
        .addScaledVector(
          forward,
          -13
        );

    desired.y+=7;

    camera.position.lerp(
      desired,
      .10
    );

    camera.lookAt(
      car.position.x,
      1.6,
      car.position.z
    );

    return;
  }

  const target=
    player.position.clone();

  target.y+=2.2;

  const radius=
    running?8.8:10.5;

  const desired=
    new THREE.Vector3(
      target.x+
        Math.sin(cameraYaw)*
        radius*
        Math.cos(cameraPitch),

      target.y+
        Math.sin(cameraPitch)*
        radius,

      target.z+
        Math.cos(cameraYaw)*
        radius*
        Math.cos(cameraPitch)
    );

  /* prevent camera going underground */
  desired.y=
    Math.max(
      desired.y,
      2.8
    );

  camera.position.lerp(
    desired,
    .10
  );

  camera.lookAt(
    target.x,
    target.y,
    target.z
  );
}

/* =========================================================
   LOCATION
========================================================= */

function updateLocation(){

  if(state.inside)
    return;

  if(state.driving)
    return;

  let closest=null;
  let distance=Infinity;

  for(const b of buildings){

    const d=
      Math.hypot(
        player.position.x-b.x,
        player.position.z-b.z
      );

    if(d<distance){

      distance=d;
      closest=b;
    }
  }

  if(
    closest &&
    distance<35
  ){

    state.location=
      "Near "+closest.name;

  }else if(
    Math.abs(player.position.x)<80 &&
    Math.abs(player.position.z)<80
  ){

    state.location=
      "Central Ibadan";

  }else{

    state.location=
      "Ibadan";
  }
}

/* =========================================================
   HUD
========================================================= */

let hudTimer=0;

function updateHUD(dt){

  hudTimer+=dt;

  if(hudTimer<.12)
    return;

  hudTimer=0;

  document.getElementById(
    "playerName"
  ).textContent=
    state.name;

  document.getElementById(
    "money"
  ).textContent=
    formatMoney(state.cash);

  document.getElementById(
    "health"
  ).textContent=
    "❤️ "+Math.round(state.health);

  document.getElementById(
    "energy"
  ).textContent=
    "⚡ "+Math.round(state.energy);

  document.getElementById(
    "hunger"
  ).textContent=
    "🍗 "+Math.round(state.hunger);

  document.getElementById(
    "hygiene"
  ).textContent=
    "🧼 "+Math.round(state.hygiene);

  const hour=
    Math.floor(
      state.minutes/60
    );

  const minute=
    Math.floor(
      state.minutes%60
    );

  const hh=
    String(
      hour%12 || 12
    ).padStart(2,"0");

  const mm=
    String(
      minute
    ).padStart(2,"0");

  const ampm=
    hour<12?"AM":"PM";

  document.getElementById(
    "clock"
  ).textContent=
    `DAY ${state.day} • ${hh}:${mm} ${ampm}`;

  document.getElementById(
    "location"
  ).textContent=
    state.location;

  if(
    state.inside
  ){

    showContextHint();

  }else if(
    !state.driving
  ){

    const b=
      nearestBuilding();

    const car=
      nearestVehicle();

    if(b){

      showContextHint(
        `🚪 ${b.name} • TAP ACTION to enter`
      );

    }else if(car){

      showContextHint(
        `🚗 ${car.userData.name||"Vehicle"} • TAP CAR to board`
      );

    }
  }
}

let hintTimer=null;

function showHint(text){

  const h=
    document.getElementById("hint");

  h.textContent=text;
  h.classList.add("show");

  clearTimeout(hintTimer);

  hintTimer=
    setTimeout(
      ()=>{
        h.classList.remove("show");
      },
      2800
    );
}

function showContextHint(text){

  const h=
    document.getElementById("hint");

  h.textContent=text;
  h.classList.add("show");
}

/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
  "actionBtn"
).addEventListener(
  "click",
  performAction
);

document.getElementById(
  "carBtn"
).addEventListener(
  "click",
  ()=>{

    if(state.driving){

      exitVehicle();
      return;
    }

    const car=
      nearestVehicle();

    if(car){

      enterVehicle(car);

    }else{

      showHint(
        "🚗 Move closer to a vehicle."
      );
    }
  }
);

document.getElementById(
  "exitBtn"
).addEventListener(
  "click",
  ()=>{

    if(state.driving){

      exitVehicle();
      return;
    }

    if(state.inside){

      exitBuilding();
      return;
    }

    showHint(
      "Nothing to exit."
    );
  }
);

/* =========================================================
   PHONE
========================================================= */

const phone=
  document.getElementById("phone");

document.getElementById(
  "phoneBtn"
).addEventListener(
  "click",
  ()=>{
    phone.style.display="flex";
  }
);

document.getElementById(
  "phoneClose"
).addEventListener(
  "click",
  ()=>{
    phone.style.display="none";
  }
);

document.querySelectorAll(
  ".phoneItem"
).forEach(btn=>{

  btn.addEventListener(
    "click",
    ()=>{

      const type=
        btn.dataset.phone;

      phone.style.display="none";

      phoneAction(type);
    }
  );
});

function phoneAction(type){

  if(type==="map"){

    showModal(
      "🗺️ Ibadan Map",
      `
      <b>Districts</b><br><br>
      🏠 Family House<br>
      🌳 Bodija<br>
      🎓 University of Ibadan<br>
      🚦 Mokola<br>
      🏢 Dugbe<br>
      ⛰️ Mapo<br>
      🚌 Iwo Road<br>
      🏙️ Challenge<br>
      🏘️ Ring Road<br>
      🌴 Jericho
      `
    );

  }

  else if(type==="jobs"){

    showJobs();

  }

  else if(type==="house"){

    showModal(
      "🏠 House",
      "Your home is fully enterable. Sleep, shower, decorate and explore your interior."
    );

  }

  else if(type==="car"){

    showModal(
      "🚗 Garage",
      `
      Current vehicle: <b>${state.ownedCar}</b><br><br>
      Owned vehicles can be summoned and driven around Ibadan.
      `
    );

  }

  else if(type==="stats"){

    showModal(
      "📊 Player Stats",
      `
      Level: <b>${state.level}</b><br>
      XP: <b>${state.xp}</b><br>
      Cash: <b>${formatMoney(state.cash)}</b><br>
      Bank: <b>${formatMoney(state.bank)}</b><br>
      Total earned: <b>${formatMoney(state.totalEarned)}</b><br>
      Total spent: <b>${formatMoney(state.totalSpent)}</b><br>
      Job: <b>${state.job}</b>
      `
    );

  }

  else if(type==="decorate"){

    decorateHouse();

  }
}

/* =========================================================
   JOBS
========================================================= */

function showJobs(){

  showModal(
    "💼 Jobs",
    "Choose a career and start earning money.",
    [
      ["🧹 Buka Attendant","Buka Attendant",2500],
      ["🛒 Market Trader","Market Trader",4000],
      ["🚌 Danfo Driver","Danfo Driver",6000],
      ["🛡️ Security Officer","Security Officer",5000],
      ["👨‍🏫 Teacher","Teacher",8000],
      ["👩‍⚕️ Nurse","Nurse",10000],
      ["💻 Software Developer","Software Developer",18000],
      ["🏦 Bank Officer","Bank Officer",15000],
      ["📱 Content Creator","Content Creator",12000]
    ]
  );
}

function takeJob(name,pay){

  state.job=name;
  state.jobPay=pay;

  showHint(
    `💼 Job selected: ${name} • Pay ₦${pay.toLocaleString()}`
  );

  saveGame();
}

function showModal(
  title,
  text,
  buttons=[]
){

  document.getElementById(
    "modalTitle"
  ).textContent=title;

  document.getElementById(
    "modalText"
  ).innerHTML=text;

  const holder=
    document.getElementById(
      "modalButtons"
    );

  holder.innerHTML="";

  buttons.forEach(b=>{

    const btn=
      document.createElement(
        "button"
      );

    btn.className=
      "modalBtn primary";

    btn.textContent=b[0];

    btn.onclick=()=>{

      takeJob(
        b[1],
        b[2]
      );

      closeModal();
    };

    holder.appendChild(btn);
  });

  document.getElementById(
    "modal"
  ).style.display="flex";
}

function closeModal(){

  document.getElementById(
    "modal"
  ).style.display="none";
}

document.getElementById(
  "modalClose"
).addEventListener(
  "click",
  closeModal
);

/* =========================================================
   DECORATION
========================================================= */

function decorateHouse(){

  if(
    !state.inside ||
    state.building!=="house"
  ){

    showModal(
      "🛋️ Decoration",
      "Enter Your House first, then use this option to place furniture."
    );

    return;
  }

  const items=[
    ["🛋️ Sofa","Sofa"],
    ["📺 TV","TV"],
    ["🛏️ Bed","Bed"],
    ["🪴 Plant","Plant"],
    ["🪑 Table","Table"]
  ];

  showModal(
    "🛋️ Decorate",
    "Add furniture to your house.",
    items.map(
      item=>[
        item[0]+" "+item[1],
        item[1],
        0
      ]
    )
  );
}

/* =========================================================
   DECORATION OVERRIDE
========================================================= */

function addFurniture(type){

  state.furniture.push({
    type,
    x:(Math.random()-.5)*12,
    z:(Math.random()-.5)*7,
    rotation:Math.random()*Math.PI
  });

  saveGame();

  if(
    state.inside &&
    state.building==="house"
  ){

    createInterior(
      buildings.find(
        b=>b.id==="house"
      )
    );
  }

  showHint(
    "🛋️ "+type+" added to your house."
  );
}

/* =========================================================
   KEYBOARD SUPPORT
========================================================= */

const keys={};

window.addEventListener(
  "keydown",
  e=>{
    keys[e.key.toLowerCase()]=true;

    if(
      e.key.toLowerCase()==="e"
    )
      performAction();

    if(
      e.key.toLowerCase()==="f"
    ){

      if(state.driving)
        exitVehicle();
      else
        const c=nearestVehicle(),
          b=nearestBuilding();

      if(c) enterVehicle(c);
      else if(b) enterBuilding(b);
    }

    if(
      e.key.toLowerCase()==="q"
    )
      exitVehicle();

  }
);

window.addEventListener(
  "keyup",
  e=>{
    keys[e.key.toLowerCase()]=false;
  }
);

/* desktop keyboard feeds joystick */

function updateKeyboardInput(){

  if(
    joy.active ||
    state.driving
  ) return;

  let x=0;
  let y=0;

  if(keys["a"]||keys["arrowleft"])
    x-=1;

  if(keys["d"]||keys["arrowright"])
    x+=1;

  if(keys["w"]||keys["arrowup"])
    y+=1;

  if(keys["s"]||keys["arrowdown"])
    y-=1;

  joy.x=x;
  joy.y=y;

  running=
    !!keys["shift"];
}

/* =========================================================
   NEEDS
========================================================= */

let needsTimer=0;

function updateNeeds(dt){

  needsTimer+=dt;

  if(
    needsTimer<5
  ) return;

  needsTimer=0;

  state.hunger=
    clamp(
      state.hunger-.45,
      0,100
    );

  state.energy=
    clamp(
      state.energy-.18,
      0,100
    );

  state.hygiene=
    clamp(
      state.hygiene-.20,
      0,100
    );

  state.social=
    clamp(
      state.social-.12,
      0,100
    );

  if(state.hunger<15)
    state.health=
      clamp(
        state.health-1,
        0,100
      );

  saveGame();
}

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{
    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

    renderer.setPixelRatio(
      Math.min(devicePixelRatio,1.7)
    );
  }
);

/* =========================================================
   STARTUP
========================================================= */

async function boot(){

  document.getElementById(
    "loadingText"
  ).textContent=
    "Building Ibadan...";

  await new Promise(
    r=>setTimeout(r,250)
  );

  document.getElementById(
    "loadingText"
  ).textContent=
    "Loading 3D character...";

  await loadRealPlayer();

  document.getElementById(
    "loadingText"
  ).textContent=
    "Loading vehicles...";

  await loadRealCar();

  document.getElementById(
    "loadingText"
  ).textContent=
    "Starting Ibadan Life...";

  player.position.set(
    state.lastOutside.x,
    0,
    state.lastOutside.z
  );

  player.rotation.y=
    state.lastOutside.yaw;

  updateCamera();

  await new Promise(
    r=>setTimeout(r,400)
  );

  document.getElementById(
    "loading"
  ).style.display="none";

  showHint(
    "🐐 Welcome to Ibadan Life. Walk around and explore."
  );
}

/* =========================================================
   MAIN LOOP
========================================================= */

let last=performance.now();

function loop(now){

  const dt=
    Math.min(
      .05,
      (now-last)/1000
    );

  last=now;

  updateKeyboardInput();

  updateTime(dt);

  updateNeeds(dt);

  if(state.driving){

    updateDriving(dt);

  }else{

    movePlayer(dt);
    updateNPCs(dt);
  }

  updateLocation();
  updateCamera();
  updateHUD(dt);

  if(playerMixer)
    playerMixer.update(dt);

  renderer.render(
    scene,
    camera
  );

  requestAnimationFrame(loop);
}

/* =========================================================
   PREVENT MOBILE PAGE BEHAVIOUR
========================================================= */

document.addEventListener(
  "contextmenu",
  e=>e.preventDefault()
);

document.addEventListener(
  "gesturestart",
  e=>e.preventDefault()
);

document.addEventListener(
  "touchmove",
  e=>{
    if(e.target===renderer.domElement)
      e.preventDefault();
  },
  {passive:false}
);

/* =========================================================
   START
========================================================= */

boot().then(
  ()=>{
    requestAnimationFrame(loop);
  }
);

</script>
